<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه فیزیک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #0f172a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
    overflow-x: hidden;
  }

  .game-wrapper {
    width: 100%;
    max-width: 1050px;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(148, 163, 184, 0.2);
  }

  /* ===== هدر کلی ===== */
  .global-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .global-title {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .global-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat.gold {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #1e293b;
    border-color: #fbbf24;
  }

  /* ===== صفحه انتخاب مرحله ===== */
  .levels-screen {
    display: block;
  }

  .levels-screen.hidden {
    display: none;
  }

  .levels-screen h2 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 5px;
  }

  .levels-screen p.subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
    padding: 15px 0;
  }

  .level-card {
    background: linear-gradient(135deg, #1e293b, #334155);
    border: 2px solid rgba(148, 163, 184, 0.2);
    border-radius: 20px;
    padding: 22px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
    position: relative;
  }

  .level-card:hover:not(.locked) {
    transform: translateY(-6px);
    border-color: #38bdf8;
    box-shadow: 0 15px 40px rgba(56, 189, 248, 0.3);
  }

  .level-card.locked {
    opacity: 0.45;
    cursor: not-allowed;
    filter: grayscale(0.8);
  }

  .level-card.completed {
    border-color: #10b981;
    background: linear-gradient(135deg, #064e3b, #065f46);
  }

  .level-icon {
    font-size: 48px;
    margin-bottom: 10px;
    display: block;
  }

  .level-name {
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 6px;
  }

  .level-desc {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 12px;
    line-height: 1.5;
    min-height: 36px;
  }

  .level-status {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    background: rgba(56, 189, 248, 0.2);
    color: #38bdf8;
  }

  .level-card.completed .level-status {
    background: rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
  }

  .level-card.locked .level-status {
    background: rgba(120, 120, 120, 0.2);
    color: #94a3b8;
  }

  /* ===== صفحه بازی ===== */
  .game-screen {
    display: none;
  }

  .game-screen.active {
    display: block;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .back-btn {
    background: rgba(148, 163, 184, 0.15);
    border: 1px solid rgba(148, 163, 184, 0.3);
    color: #cbd5e1;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    transition: all 0.2s;
  }

  .back-btn:hover {
    background: rgba(148, 163, 184, 0.25);
  }

  .game-header h2 {
    font-size: 18px;
    color: #f1f5f9;
    margin: 0;
  }

  .level-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-size: 14px;
    color: #94a3b8;
  }

  /* ===== محفظه کنواس ===== */
  .canvas-wrapper {
    position: relative;
    background: #0a0f1e;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(148, 163, 184, 0.15);
  }

  .canvas-wrapper canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ===== دکمه‌های خاص هر مرحله ===== */
  .game-specific-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 18px;
    flex-wrap: wrap;
    min-height: 70px;
  }

  .ctrl-arrow {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #fff;
    border: none;
    font-size: 26px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .ctrl-arrow:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 28px rgba(56, 189, 248, 0.6);
  }

  .ctrl-arrow:active {
    transform: scale(0.92);
  }

  .ctrl-arrow.up {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
  }

  .ctrl-arrow.down {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
  }

  /* دکمه ترمز (خاص مرحله ۱) */
  .ctrl-btn.brake {
    padding: 16px 50px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    background: linear-gradient(135deg, #dc2626, #ef4444);
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5);
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .ctrl-btn.brake:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(220, 38, 38, 0.7);
  }

  .ctrl-btn.brake:active {
    transform: translateY(0);
  }

  /* ===== دکمه‌های عمومی ===== */
  .game-actions {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 12px 30px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    background: rgba(148, 163, 184, 0.15);
    color: #cbd5e1;
    border: 2px solid rgba(148, 163, 184, 0.25);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .action-btn:hover {
    background: rgba(148, 163, 184, 0.3);
    transform: translateY(-3px);
  }

  /* ===== مودال ===== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .modal.active { display: flex; }

  .modal-box {
    background: linear-gradient(135deg, #1e293b, #334155);
    border-radius: 24px;
    max-width: 560px;
    width: 100%;
    max-height: calc(100vh - 30px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    animation: popIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-content {
    padding: 30px 28px 20px;
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    text-align: center;
    scrollbar-width: thin;
    scrollbar-color: #475569 #1e293b;
  }

  .modal-content::-webkit-scrollbar { width: 8px; }
  .modal-content::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
  .modal-content::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

  .modal-emoji {
    font-size: 70px;
    margin-bottom: 12px;
    animation: bounce 1s ease infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .modal-title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal-actions {
    padding: 18px 28px 22px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    border-top: 1px solid rgba(148, 163, 184, 0.15);
    background: rgba(15, 23, 42, 0.5);
    flex-shrink: 0;
  }

  .modal-btn {
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .modal-btn.primary {
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color: #fff;
    box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
  }

  .modal-btn.primary:hover { transform: translateY(-3px); }

  .modal-btn.secondary {
    background: rgba(148, 163, 184, 0.2);
    color: #e2e8f0;
  }

  .modal-btn.secondary:hover { background: rgba(148, 163, 184, 0.35); }

  /* ===== ریسپانسیو ===== */
  @media (max-width: 640px) {
    .game-wrapper { padding: 15px; border-radius: 18px; }
    .levels-grid { grid-template-columns: 1fr; }
    .modal-box { border-radius: 18px; }
    .modal-content { padding: 22px 18px 15px; }
    .modal-actions { padding: 15px 18px; }
    .modal-btn { padding: 10px 18px; font-size: 14px; flex: 1; }
    .modal-emoji { font-size: 55px; }
    .modal-title { font-size: 20px; }
    .ctrl-arrow { width: 55px; height: 55px; font-size: 22px; }
  }
</style>
</head>
<body>

<div class="game-wrapper">

  <!-- ===== هدر کلی ===== -->
  <div class="global-header">
    <div class="global-title">⚡ آزمایشگاه فیزیک</div>
    <div class="global-stats">
      <div class="stat gold">🏆 امتیاز کل: <span id="totalScore">0</span></div>
      <div class="stat">🎯 مرحله: <span id="currentLevelNum">1</span>/<span id="totalLevels">4</span></div>
    </div>
  </div>

  <!-- ===== صفحه انتخاب مرحله ===== -->
  <div class="levels-screen" id="levelsScreen">
    <h2>🗺️ انتخاب مرحله</h2>
    <p class="subtitle">هر مرحله یک مفهوم فیزیک را آموزش می‌دهد</p>
    <div class="levels-grid" id="levelsGrid"></div>
  </div>

  <!-- ===== صفحه بازی ===== -->
  <div class="game-screen" id="gameScreen">
    <div class="game-header">
      <button class="back-btn" id="backBtn">↩ بازگشت</button>
      <h2 id="gameTitle">مرحله ۱</h2>
      <div style="width: 120px;"></div>
    </div>

    <div class="level-info">
      <span id="levelName">مرحله ۱</span>
      <span id="levelHint">برای ترمز دکمه را نگه دارید</span>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="1000" height="520"></canvas>
      <canvas id="gameCanvas3D" width="1000" height="520" style="display:none; position:absolute; top:0; left:0;"></canvas>
    </div>

    <!-- دکمه‌های خاص هر مرحله (داینامیک) -->
    <div class="game-specific-controls" id="gameControls"></div>

    <!-- دکمه‌های عمومی -->
    <div class="game-actions">
      <button class="action-btn" id="resetBtn">🔄 شروع مجدد</button>
    </div>
  </div>

</div>

<!-- ===== مودال ===== -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-content">
      <div class="modal-emoji" id="modalEmoji">🎉</div>
      <div class="modal-title" id="modalTitle">آفرین!</div>
      <div class="modal-msg" id="modalMsg"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="modalBackBtn">🗺️ مراحل</button>
      <button class="modal-btn primary" id="modalNextBtn">▶ ادامه</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  /* ══════════════════════════════════════════════════════════════
     📦 کلاس پایه مرحله
     ══════════════════════════════════════════════════════════════ */
     class BaseLevel {
  constructor(game) {
    this.game = game;
    this.ctx = game.ctx;
    this.canvas = game.canvas;
  }
  init() {}
  update(dt) {}
  render() {}
  handleInput(action, pressed) {}
  handleClick(x, y) {}
  checkResult() { return null; }
  is3D() { return false; }   // ⭐ اضافه شد
}
  
  /* ══════════════════════════════════════════════════════════════
     🚗 مرحله ۱: ترمز ماشین
     ══════════════════════════════════════════════════════════════ */
  class Level1_Brake extends BaseLevel {
    init() {
      this.roadLengthMeters = 100;
      this.roadStartMeters = 10;
      
      this.carPositionM = this.roadStartMeters;
      this.carSpeedMs = 30;
      this.initialSpeedMs = 30;
      
      this.brakeForceMs2 = 8;
      this.braking = false;
      
      this.targetZoneStartM = 65;
      this.targetZoneEndM = 85;
      this.targetZoneWidthM = this.targetZoneEndM - this.targetZoneStartM;
      
      this.wallPositionM = this.roadLengthMeters;
      
      this.pixelsPerMeter = 10;
      this.roadStartX = 30;
      this.roadY = 380;
      this.roadHeight = 80;
      
      this.elapsed = 0;
      this.crashed = false;
      this.stopped = false;
      this.finished = false;
      
      this.arrowOffset = 0;
      this.stopArrowOffset = 0;
    }
  
    update(dt) {
      if (this.finished) return;
      this.elapsed += dt;
      this.arrowOffset = (this.arrowOffset + dt * 20) % 20;
      this.stopArrowOffset = (this.stopArrowOffset + dt * 25) % 15;
      
      if (this.braking && this.carSpeedMs > 0) {
        this.carSpeedMs -= this.brakeForceMs2 * dt;
        if (this.carSpeedMs < 0) this.carSpeedMs = 0;
      }
      
      this.carPositionM += this.carSpeedMs * dt;
      
      if (this.carSpeedMs === 0 && !this.stopped) {
        this.stopped = true;
        this.finished = true;
      }
      
      if (this.carPositionM >= this.wallPositionM - 2) {
        this.crashed = true;
        this.finished = true;
      }
    }
  
    handleInput(action, pressed) {
      if (action === 'brake') this.braking = pressed;
    }
  
    checkResult() {
      if (!this.finished) return null;
      
      if (this.crashed) {
        return {
          status: 'lose',
          reason: `💥 بیش از حد دیر ترمز کردی! ماشین به دیوار خورد.`,
          formula: {
            title: 'فاصله توقف واقعی',
            calc: `d = v² / (2a) = ${this.initialSpeedMs}² / (2 × ${this.brakeForceMs2}) = ${(this.initialSpeedMs ** 2 / (2 * this.brakeForceMs2)).toFixed(1)} m`,
            note: `ماشین به ${(this.initialSpeedMs ** 2 / (2 * this.brakeForceMs2)).toFixed(1)} متر نیاز داشت، ولی دیرتر ترمز زدی.`
          }
        };
      }
      
      if (this.carPositionM >= this.targetZoneStartM && this.carPositionM <= this.targetZoneEndM) {
        const timeBonus = Math.max(0, 20 - Math.floor(this.elapsed));
        const stopDist = this.initialSpeedMs ** 2 / (2 * this.brakeForceMs2);
        return {
          status: 'win',
          reason: `🎯 ماشین در متر ${this.carPositionM.toFixed(1)} متوقف شد — دقیقاً در ناحیه پارک!`,
          score: 100 + timeBonus,
          formula: {
            title: 'محاسبه فاصله توقف',
            calc: `d = v² / (2a) = ${this.initialSpeedMs}² / (2 × ${this.brakeForceMs2}) = ${stopDist.toFixed(1)} m`,
            note: `از لحظه ترمز تا توقف، ماشین به ${stopDist.toFixed(1)} متر نیاز داشت.`
          }
        };
      }
      
      if (this.carPositionM < this.targetZoneStartM) {
        const distance = (this.targetZoneStartM - this.carPositionM).toFixed(1);
        return {
          status: 'lose',
          reason: `🛑 خیلی زود ترمز کردی! ${distance} متر عقب‌تر از ناحیه پارک ایستادی.`,
          formula: {
            title: 'محاسبه فاصله توقف',
            calc: `d = v² / (2a) = ${this.initialSpeedMs}² / (2 × ${this.brakeForceMs2}) = ${(this.initialSpeedMs ** 2 / (2 * this.brakeForceMs2)).toFixed(1)} m`,
            note: 'کمی دیرتر ترمز بزن.'
          }
        };
      }
      
      return {
        status: 'lose',
        reason: `⚠️ از ناحیه پارک عبور کردی!`,
        formula: {
          title: 'محاسبه فاصله توقف',
          calc: `d = v² / (2a) = ${(this.initialSpeedMs ** 2 / (2 * this.brakeForceMs2)).toFixed(1)} m`,
          note: 'کمی زودتر ترمز بزن.'
        }
      };
    }
  
    mToPx(meters) {
      return this.roadStartX + meters * this.pixelsPerMeter;
    }
    
    getStoppingDistance() {
      return (this.carSpeedMs * this.carSpeedMs) / (2 * this.brakeForceMs2);
    }
    
    getDistanceToTarget() {
      return Math.max(0, this.targetZoneStartM - this.carPositionM);
    }
  
    render() {
      const ctx = this.ctx;
      const W = this.canvas.width;
      const H = this.canvas.height;
      
      // آسمان
      const skyGrad = ctx.createLinearGradient(0, 0, 0, this.roadY);
      skyGrad.addColorStop(0, '#0c4a6e');
      skyGrad.addColorStop(1, '#38bdf8');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, this.roadY);
      
      // خورشید
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.arc(850, 80, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // زمین
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, this.roadY, W, H - this.roadY);
      
      // جاده
      ctx.fillStyle = '#334155';
      ctx.fillRect(this.mToPx(0), this.roadY, this.roadLengthMeters * this.pixelsPerMeter, this.roadHeight);
      
      // خط‌چین مرکزی
      for (let m = 0; m < this.roadLengthMeters; m += 5) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(this.mToPx(m), this.roadY + this.roadHeight / 2 - 2, 30, 4);
      }
      
      // ناحیه پارک
      const inTarget = this.carSpeedMs === 0 && this.carPositionM >= this.targetZoneStartM && this.carPositionM <= this.targetZoneEndM;
      ctx.fillStyle = inTarget ? 'rgba(34, 197, 94, 0.4)' : 'rgba(34, 197, 94, 0.2)';
      ctx.fillRect(this.mToPx(this.targetZoneStartM), this.roadY, this.targetZoneWidthM * this.pixelsPerMeter, this.roadHeight);
      
      // حاشیه
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 5]);
      ctx.strokeRect(this.mToPx(this.targetZoneStartM), this.roadY, this.targetZoneWidthM * this.pixelsPerMeter, this.roadHeight);
      ctx.setLineDash([]);
      
      // P
      ctx.fillStyle = '#22c55e';
      ctx.font = 'bold 28px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText('P', this.mToPx((this.targetZoneStartM + this.targetZoneEndM) / 2), this.roadY + 50);
      
      // دیوار
      const wallX = this.mToPx(this.wallPositionM);
      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(wallX, this.roadY - 60, 20, this.roadHeight + 60);
      for (let y = this.roadY - 60; y < this.roadY + this.roadHeight; y += 20) {
        ctx.fillStyle = (Math.floor(y / 20) % 2 === 0) ? '#dc2626' : '#fff';
        ctx.fillRect(wallX, y, 20, 20);
      }
      
      this.renderRuler(ctx);
      this.renderDistanceArrows(ctx);
      this.renderCar(ctx);
      this.renderHUD(ctx);
      
      if (this.crashed) this.renderExplosion(ctx);
    }
  
    renderRuler(ctx) {
      const y = this.roadY + this.roadHeight + 15;
      ctx.font = 'bold 11px Vazirmatn';
      ctx.textAlign = 'center';
      
      for (let m = 0; m <= this.roadLengthMeters; m += 10) {
        const x = this.mToPx(m);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, this.roadY + this.roadHeight);
        ctx.lineTo(x, this.roadY + this.roadHeight + 8);
        ctx.stroke();
        
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`${m}m`, x, y + 12);
      }
    }
  
    renderDistanceArrows(ctx) {
      const carX = this.mToPx(this.carPositionM) + 40;
      const targetX = this.mToPx(this.targetZoneStartM);
      const arrowY = this.roadY - 100;
      const distToTarget = this.getDistanceToTarget();
      
      if (distToTarget > 0.5) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(carX, arrowY);
        ctx.lineTo(targetX, arrowY);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(carX, arrowY - 10);
        ctx.lineTo(carX, arrowY + 10);
        ctx.moveTo(targetX, arrowY - 10);
        ctx.lineTo(targetX, arrowY + 10);
        ctx.stroke();
        
        this.drawMovingArrows(ctx, carX, targetX, arrowY, '#38bdf8', this.arrowOffset);
        
        const midX = (carX + targetX) / 2;
        const label = `${distToTarget.toFixed(1)} m`;
        ctx.font = 'bold 16px Vazirmatn';
        const tw = ctx.measureText(label).width;
        
        ctx.fillStyle = 'rgba(56, 189, 248, 0.95)';
        ctx.shadowColor = 'rgba(56, 189, 248, 0.6)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.roundRect(midX - (tw + 30) / 2, arrowY - 16, tw + 30, 32, 10);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, midX, arrowY);
        ctx.textBaseline = 'alphabetic';
        
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 12px Vazirmatn';
        ctx.fillText('📏 فاصله تا پارک', midX, arrowY - 25);
      }
      
      // پیکان محل توقف
      if (this.braking && !this.stopped && !this.crashed) {
        const stopDist = this.getStoppingDistance();
        const stopPosM = this.carPositionM + stopDist;
        const stopX = this.mToPx(stopPosM);
        const arrowY2 = this.roadY - 170;
        
        const inside = stopPosM >= this.targetZoneStartM && stopPosM <= this.targetZoneEndM;
        const boxColor = inside ? 'rgba(34, 197, 94, 0.95)' : 'rgba(245, 158, 11, 0.95)';
        
        ctx.strokeStyle = '#a78bfa';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(carX, arrowY2);
        ctx.lineTo(stopX, arrowY2);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(carX, arrowY2 - 10);
        ctx.lineTo(carX, arrowY2 + 10);
        ctx.moveTo(stopX, arrowY2 - 10);
        ctx.lineTo(stopX, arrowY2 + 10);
        ctx.stroke();
        
        this.drawMovingArrows(ctx, carX, stopX, arrowY2, '#a78bfa', this.stopArrowOffset);
        
        const midX = (carX + stopX) / 2;
        const label = `${stopDist.toFixed(1)} m`;
        ctx.font = 'bold 16px Vazirmatn';
        const tw = ctx.measureText(label).width;
        
        ctx.fillStyle = boxColor;
        ctx.shadowColor = inside ? 'rgba(34, 197, 94, 0.6)' : 'rgba(245, 158, 11, 0.6)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.roundRect(midX - (tw + 30) / 2, arrowY2 - 16, tw + 30, 32, 10);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, midX, arrowY2);
        ctx.textBaseline = 'alphabetic';
        
        ctx.fillStyle = inside ? '#22c55e' : '#f59e0b';
        ctx.font = 'bold 12px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText(inside ? '🛑 توقف مناسب' : '⚠️ خارج از پارک', midX, arrowY2 - 25);
      }
    }
  
    drawMovingArrows(ctx, x1, x2, y, color, offset) {
      const start = Math.min(x1, x2);
      const end = Math.max(x1, x2);
      const gap = 20;
      const arrowSize = 7;
      ctx.fillStyle = color;
      
      for (let x = start + offset; x < end - arrowSize * 2; x += gap) {
        ctx.beginPath();
        ctx.moveTo(x, y - arrowSize);
        ctx.lineTo(x + arrowSize, y);
        ctx.lineTo(x, y + arrowSize);
        ctx.closePath();
        ctx.fill();
      }
    }
  
    renderCar(ctx) {
      const x = this.mToPx(this.carPositionM);
      const y = this.roadY + this.roadHeight - 55;
      
      ctx.fillStyle = this.braking ? '#dc2626' : '#3b82f6';
      ctx.beginPath();
      ctx.roundRect(x, y, 80, 45, 10);
      ctx.fill();
      
      ctx.fillStyle = this.braking ? '#991b1b' : '#1d4ed8';
      ctx.beginPath();
      ctx.roundRect(x + 20, y - 20, 45, 25, 8);
      ctx.fill();
      
      ctx.fillStyle = 'rgba(186, 230, 253, 0.7)';
      ctx.beginPath();
      ctx.roundRect(x + 24, y - 15, 16, 18, 4);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x + 44, y - 15, 16, 18, 4);
      ctx.fill();
      
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(x + 18, y + 50, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + 62, y + 50, 14, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x + 18, y + 50, 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x + 62, y + 50, 8, 0, Math.PI * 2);
      ctx.stroke();
      
      if (this.braking) {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(x + 5, y + 20, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  
    renderHUD(ctx) {
      // سرعت
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      ctx.roundRect(20, 20, 200, 90, 15);
      ctx.fill();
      
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('🚗 سرعت', 210, 42);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText(`${this.carSpeedMs.toFixed(1)} m/s`, 210, 72);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 12px Vazirmatn';
      ctx.fillText(`≈ ${(this.carSpeedMs * 3.6).toFixed(0)} km/h`, 210, 95);
      
      // فاصله
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      ctx.roundRect(230, 20, 200, 90, 15);
      ctx.fill();
      
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('📏 فاصله تا پارک', 420, 42);
      
      const distToTarget = this.getDistanceToTarget();
      ctx.fillStyle = distToTarget > 20 ? '#fff' : '#22c55e';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText(`${distToTarget.toFixed(1)} m`, 420, 72);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 12px Vazirmatn';
      ctx.fillText(`ناحیه: ${this.targetZoneStartM}-${this.targetZoneEndM}m`, 420, 95);
      
      // زمان
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      ctx.roundRect(440, 20, 160, 90, 15);
      ctx.fill();
      
      ctx.fillStyle = '#a78bfa';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('⏱️ زمان', 590, 42);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText(`${this.elapsed.toFixed(2)} s`, 590, 72);
      
      // فاصله توقف
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      ctx.roundRect(610, 20, 240, 90, 15);
      ctx.fill();
      
      ctx.fillStyle = '#a78bfa';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('🛑 فاصله توقف لازم', 840, 42);
      
      const stopDist = this.getStoppingDistance();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText(`${stopDist.toFixed(1)} m`, 840, 72);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText('d = v² / 2a', 840, 95);
    }
  
    renderExplosion(ctx) {
      const x = this.mToPx(this.carPositionM) + 40;
      const y = this.roadY + this.roadHeight - 30;
      
      ctx.fillStyle = 'rgba(251, 191, 36, 0.8)';
      ctx.beginPath();
      ctx.arc(x, y, 60, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = 'rgba(239, 68, 68, 0.9)';
      ctx.beginPath();
      ctx.arc(x, y, 40, 0, Math.PI * 2);
      ctx.fill();
      
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const dist = 70 + Math.random() * 30;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist, 6, 0, Math.PI * 2);
        ctx.fill();
      }
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText('💥', x, y - 80);
    }
  }
  
  /* ══════════════════════════════════════════════════════════════
     🏹 مرحله ۲: پرتابه (حرکت پرتابی)
     ══════════════════════════════════════════════════════════════ */
  class Level2_Projectile extends BaseLevel {
    init() {
      this.g = 9.8;
      this.source = { x: 100, y: 440 };
      this.target = { x: 820, y: 380, radius: 35 };
      
      this.pixelsPerMeter = 8;
      this.groundY = 470;
      
      this.angle = 45;
      this.speed = 25;
      
      this.minAngle = 10;
      this.maxAngle = 80;
      this.minSpeed = 10;
      this.maxSpeed = 40;
      
      this.launched = false;
      this.finished = false;
      this.hitTarget = false;
      
      this.t = 0;
      this.ballX = 0;
      this.ballY = 0;
      this.trajectory = [];
      this.finalPosition = null;
      this.lastError = null;
    }
  
    handleInput(action, pressed) {
      if (this.launched) return;
      
      if (action === 'angleUp') this.angle = Math.min(this.maxAngle, this.angle + 1);
      if (action === 'angleDown') this.angle = Math.max(this.minAngle, this.angle - 1);
      
      if (action === 'speedUp') this.speed = Math.min(this.maxSpeed, this.speed + 0.5);
      if (action === 'speedDown') this.speed = Math.max(this.minSpeed, this.speed - 0.5);
      
      if (action === 'launch' && !this.launched) {
        this.launch();
      }
    }
  
    launch() {
      this.launched = true;
      this.t = 0;
      this.trajectory = [];
    }
  
    update(dt) {
      if (this.finished) return;
      
      if (this.launched) {
        this.t += dt;
        
        const theta = (this.angle * Math.PI) / 180;
        const vx = this.speed * Math.cos(theta);
        const vy = this.speed * Math.sin(theta);
        
        const xm = vx * this.t;
        const ym = vy * this.t - 0.5 * this.g * this.t * this.t;
        
        this.ballX = 60 + xm * this.pixelsPerMeter;
        this.ballY = this.groundY - ym * this.pixelsPerMeter;
        
        if (this.trajectory.length === 0 || 
            this.t - this.trajectory[this.trajectory.length - 1].t > 0.02) {
          this.trajectory.push({ x: this.ballX, y: this.ballY, t: this.t });
        }
        
        const distToTarget = Math.hypot(
          this.ballX - this.target.x,
          this.ballY - this.target.y
        );
        
        if (distToTarget < this.target.radius + 15) {
          this.hitTarget = true;
          this.finalPosition = { x: this.ballX, y: this.ballY };
          this.finished = true;
          return;
        }
        
        if (this.ballY >= this.groundY) {
          this.ballY = this.groundY;
          this.finalPosition = { x: this.ballX, y: this.ballY };
          
          this.lastError = {
            horizontal: (this.ballX - this.target.x) / this.pixelsPerMeter,
            vertical: (this.groundY - this.target.y) / this.pixelsPerMeter,
            total: Math.hypot(this.ballX - this.target.x, this.groundY - this.target.y) / this.pixelsPerMeter
          };
          
          this.finished = true;
          return;
        }
        
        if (this.ballX > this.canvas.width + 50 || this.t > 20) {
          this.finalPosition = { x: this.ballX, y: this.ballY };
          this.finished = true;
        }
      }
    }
  
    checkResult() {
      if (!this.finished) return null;
      
      const theta = (this.angle * Math.PI) / 180;
      const range = (this.speed ** 2 * Math.sin(2 * theta)) / this.g;
      const maxHeight = (this.speed ** 2 * Math.sin(theta) ** 2) / (2 * this.g);
      const flightTime = (2 * this.speed * Math.sin(theta)) / this.g;
      
      const distanceToTarget = (this.target.x - this.source.x) / this.pixelsPerMeter;
      
      if (this.hitTarget) {
        return {
          status: 'win',
          reason: `🎯 توپ دقیقاً به هدف برخورد کرد!`,
          score: 150,
          formula: {
            title: 'حرکت پرتابی',
            calc: `R = v²·sin(2θ)/g = ${this.speed}²·sin(${(2 * this.angle).toFixed(0)}°)/9.8 = ${range.toFixed(1)} m`,
            note: `زاویه ${this.angle}°، سرعت ${this.speed} m/s. ارتفاع اوج: ${maxHeight.toFixed(1)} متر، زمان پرواز: ${flightTime.toFixed(2)} ثانیه.`
          }
        };
      }
      
      const errorMeters = this.lastError ? this.lastError.total.toFixed(1) : '?';
      
      let hint = '';
      if (this.lastError) {
        if (this.lastError.horizontal < 0) {
          hint = `توپ ${Math.abs(this.lastError.horizontal).toFixed(1)} متر قبل از هدف افتاد. زاویه یا سرعت را بیشتر کن.`;
        } else {
          hint = `توپ ${this.lastError.horizontal.toFixed(1)} متر بعد از هدف افتاد. زاویه یا سرعت را کمتر کن.`;
        }
      }
      
      return {
        status: 'lose',
        reason: `😢 توپ به هدف نخورد. فاصله تا هدف: ${errorMeters} متر`,
        formula: {
          title: 'حرکت پرتابی',
          calc: `R = v²·sin(2θ)/g = ${range.toFixed(1)} m`,
          note: `برد فعلی توپ ${range.toFixed(1)} متر بود، ولی هدف در فاصله ${distanceToTarget.toFixed(1)} متر قرار دارد. ${hint}`
        }
      };
    }
  
    render() {
      const ctx = this.ctx;
      const W = this.canvas.width;
      const H = this.canvas.height;
      
      const skyGrad = ctx.createLinearGradient(0, 0, 0, this.groundY);
      skyGrad.addColorStop(0, '#1e3a8a');
      skyGrad.addColorStop(0.5, '#3b82f6');
      skyGrad.addColorStop(1, '#93c5fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, this.groundY);
      
      this.renderClouds(ctx);
      
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.arc(150, 80, 45, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      const groundGrad = ctx.createLinearGradient(0, this.groundY, 0, H);
      groundGrad.addColorStop(0, '#166534');
      groundGrad.addColorStop(1, '#14532d');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, this.groundY, W, H - this.groundY);
      
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, this.groundY);
      ctx.lineTo(W, this.groundY);
      ctx.stroke();
      
      this.renderRuler(ctx);
      
      if (!this.launched) {
        this.renderPredictedPath(ctx);
      }
      
      if (this.launched && this.trajectory.length > 1) {
        this.renderTrajectory(ctx);
      }
      
      this.renderTarget(ctx);
      this.renderBall(ctx);
      this.renderLauncher(ctx);
      this.renderHUD(ctx);
    }
  
    renderClouds(ctx) {
      const t = Date.now() / 10000;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      
      const clouds = [
        { x: (200 + t * 5) % 1200 - 100, y: 100, s: 1 },
        { x: (500 + t * 3) % 1200 - 100, y: 60, s: 0.8 },
        { x: (800 + t * 4) % 1200 - 100, y: 130, s: 1.1 },
      ];
      
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 25 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 30 * c.s, c.y, 30 * c.s, 0, Math.PI * 2);
        ctx.arc(c.x + 60 * c.s, c.y, 25 * c.s, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  
    renderRuler(ctx) {
      const y = this.groundY + 20;
      ctx.font = 'bold 11px Vazirmatn';
      ctx.textAlign = 'center';
      
      for (let m = 0; m <= 100; m += 10) {
        const x = 60 + m * this.pixelsPerMeter;
        if (x > this.canvas.width) break;
        
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, this.groundY);
        ctx.lineTo(x, this.groundY + 8);
        ctx.stroke();
        
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`${m}m`, x, y + 12);
      }
    }
  
    renderPredictedPath(ctx) {
      const theta = (this.angle * Math.PI) / 180;
      const vx = this.speed * Math.cos(theta);
      const vy = this.speed * Math.sin(theta);
      
      const flightTime = (2 * vy) / this.g;
      
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      
      const steps = 60;
      let firstPoint = true;
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * flightTime;
        const xm = vx * t;
        const ym = vy * t - 0.5 * this.g * t * t;
        
        const px = 60 + xm * this.pixelsPerMeter;
        const py = this.groundY - ym * this.pixelsPerMeter;
        
        if (firstPoint) {
          ctx.moveTo(px, py);
          firstPoint = false;
        } else {
          ctx.lineTo(px, py);
        }
        
        if (py >= this.groundY) break;
      }
      ctx.stroke();
      ctx.setLineDash([]);
      
      const range = (this.speed ** 2 * Math.sin(2 * theta)) / this.g;
      const landingX = 60 + range * this.pixelsPerMeter;
      
      if (landingX < this.canvas.width + 50) {
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(landingX, this.groundY - 30);
        ctx.lineTo(landingX, this.groundY + 5);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 12px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText(`فرود در ${range.toFixed(1)}m`, landingX, this.groundY - 40);
      }
    }
  
    renderTrajectory(ctx) {
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(this.trajectory[0].x, this.trajectory[0].y);
      for (let i = 1; i < this.trajectory.length; i++) {
        ctx.lineTo(this.trajectory[i].x, this.trajectory[i].y);
      }
      ctx.stroke();
    }
  
    renderTarget(ctx) {
      const t = this.target;
      
      ctx.fillStyle = '#8b5cf6';
      ctx.fillRect(t.x - 5, t.y + t.radius, 10, this.groundY - t.y - t.radius);
      
      ctx.shadowColor = this.hitTarget ? '#22c55e' : 'transparent';
      ctx.shadowBlur = this.hitTarget ? 30 : 0;
      
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.fillStyle = this.hitTarget ? '#22c55e' : '#ef4444';
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius * 0.4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.shadowBlur = 0;
    }
  
    renderBall(ctx) {
      if (!this.launched) return;
      
      const x = this.ballX;
      const y = this.ballY;
      
      ctx.shadowColor = this.hitTarget ? '#22c55e' : '#fbbf24';
      ctx.shadowBlur = 20;
      
      ctx.fillStyle = this.hitTarget ? '#22c55e' : '#fbbf24';
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(x - 4, y - 4, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  
    renderLauncher(ctx) {
      const x = this.source.x;
      const y = this.source.y;
      
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.roundRect(x - 30, y + 10, 60, 25, 8);
      ctx.fill();
      
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(x - 20, y + 45, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + 20, y + 45, 10, 0, Math.PI * 2);
      ctx.fill();
      
      const rad = -(this.angle * Math.PI) / 180;
      const len = 55;
      const endX = x + Math.cos(rad) * len;
      const endY = y + Math.sin(rad) * len;
      
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.arc(endX, endY, 8, 0, Math.PI * 2);
      ctx.fill();
      
      if (!this.launched) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 14px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText(`${this.angle}°`, x + 40, y - 40);
      }
    }
  
    renderHUD(ctx) {
      const W = this.canvas.width;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(20, 20, 200, 90, 15);
      ctx.fill();
      
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('📐 زاویه پرتاب', 210, 42);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px Vazirmatn';
      ctx.fillText(`${this.angle}°`, 210, 75);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText('◀ ▶ یا Arrow keys', 210, 98);
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(230, 20, 200, 90, 15);
      ctx.fill();
      
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('🚀 سرعت اولیه', 420, 42);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px Vazirmatn';
      ctx.fillText(`${this.speed.toFixed(1)} m/s`, 420, 75);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText('▲ ▼ یا Arrow Up/Down', 420, 98);
      
      if (!this.launched) {
        const theta = (this.angle * Math.PI) / 180;
        const range = (this.speed ** 2 * Math.sin(2 * theta)) / this.g;
        const maxH = (this.speed ** 2 * Math.sin(theta) ** 2) / (2 * this.g);
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.beginPath();
        ctx.roundRect(W - 280, 20, 260, 130, 15);
        ctx.fill();
        
        ctx.fillStyle = '#a78bfa';
        ctx.font = 'bold 13px Vazirmatn';
        ctx.textAlign = 'right';
        ctx.fillText('📊 پیش‌بینی فیزیکی', W - 55, 45);
        
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 15px Vazirmatn';
        ctx.textAlign = 'right';
        ctx.fillText(`برد: ${range.toFixed(1)} m`, W - 55, 75);
        ctx.fillText(`ارتفاع اوج: ${maxH.toFixed(1)} m`, W - 55, 100);
        ctx.fillText(`زمان پرواز: ${(2 * this.speed * Math.sin(theta) / this.g).toFixed(2)} s`, W - 55, 125);
      }
      
      if (!this.launched) {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
        ctx.font = 'bold 14px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText('🎯 زاویه و سرعت را تنظیم کن، بعد Space بزن!', W / 2, 40);
      }
    }
  }
  
  /* ══════════════════════════════════════════════════════════════
     ⚖️ مرحله ۳: تعادل اهرم (گشتاور)
     ══════════════════════════════════════════════════════════════ */
  class Level3_Balance extends BaseLevel {
    init() {
      this.pivotX = 500;
      this.pivotY = 280;
      this.barLength = 700;
      this.barThickness = 18;
      
      this.pixelsPerMeter = 20;
      
      this.minDistance = 1.0;
      this.maxDistance = 5.0;
      
      this.leftWeights = [
        { mass: 10, distance: 3.0, color: '#ef4444', selected: false },
        { mass: 5,  distance: 1.5, color: '#f59e0b', selected: false }
      ];
      
      this.rightWeights = [
        { mass: 8,  distance: 2.5, color: '#3b82f6', selected: false },
        { mass: 12, distance: 4.0, color: '#8b5cf6', selected: false }
      ];
      
      this.selectedWeight = null;
      
      this.elapsed = 0;
      this.finished = false;
      this.solved = false;
      this.holdTime = 0;
      this.requiredHold = 1.5;
      this.tolerance = 0.3;
      
      this.currentAngle = 0;
      this.targetAngle = 0;
    }
  
    calculateTorque(weights) {
      return weights.reduce((sum, w) => sum + w.mass * w.distance, 0);
    }
  
    getLeftTorque() {
      return this.calculateTorque(this.leftWeights);
    }
  
    getRightTorque() {
      return this.calculateTorque(this.rightWeights);
    }
  
    handleInput(action, pressed) {
      if (this.finished) return;
      if (!pressed) return;
      
      if (action === 'selectNext') this.selectNextWeight();
      if (action === 'selectPrev') this.selectPrevWeight();
      
      if (action === 'moveLeft' && this.selectedWeight) {
        this.moveWeight(-0.2);
      }
      if (action === 'moveRight' && this.selectedWeight) {
        this.moveWeight(0.2);
      }
    }
  
    selectNextWeight() {
      const allWeights = [
        ...this.leftWeights.map((w, i) => ({ side: 'left', index: i })),
        ...this.rightWeights.map((w, i) => ({ side: 'right', index: i }))
      ];
      
      if (this.selectedWeight) {
        const prev = this.selectedWeight;
        const arr = prev.side === 'left' ? this.leftWeights : this.rightWeights;
        arr[prev.index].selected = false;
      }
      
      let currentIdx = -1;
      if (this.selectedWeight) {
        currentIdx = allWeights.findIndex(w => 
          w.side === this.selectedWeight.side && 
          w.index === this.selectedWeight.index
        );
      }
      
      const nextIdx = (currentIdx + 1) % allWeights.length;
      this.selectedWeight = allWeights[nextIdx];
      
      const arr = this.selectedWeight.side === 'left' ? this.leftWeights : this.rightWeights;
      arr[this.selectedWeight.index].selected = true;
    }
  
    selectPrevWeight() {
      const allWeights = [
        ...this.leftWeights.map((w, i) => ({ side: 'left', index: i })),
        ...this.rightWeights.map((w, i) => ({ side: 'right', index: i }))
      ];
      
      if (this.selectedWeight) {
        const prev = this.selectedWeight;
        const arr = prev.side === 'left' ? this.leftWeights : this.rightWeights;
        arr[prev.index].selected = false;
      }
      
      let currentIdx = 0;
      if (this.selectedWeight) {
        currentIdx = allWeights.findIndex(w => 
          w.side === this.selectedWeight.side && 
          w.index === this.selectedWeight.index
        );
      }
      
      const prevIdx = (currentIdx - 1 + allWeights.length) % allWeights.length;
      this.selectedWeight = allWeights[prevIdx];
      
      const arr = this.selectedWeight.side === 'left' ? this.leftWeights : this.rightWeights;
      arr[this.selectedWeight.index].selected = true;
    }
  
    moveWeight(delta) {
      if (!this.selectedWeight) return;
      
      const arr = this.selectedWeight.side === 'left' ? this.leftWeights : this.rightWeights;
      const w = arr[this.selectedWeight.index];
      
      w.distance += delta;
      w.distance = Math.max(this.minDistance, Math.min(this.maxDistance, w.distance));
    }
  
    update(dt) {
      if (this.finished) return;
      this.elapsed += dt;
      
      const leftT = this.getLeftTorque();
      const rightT = this.getRightTorque();
      const diff = leftT - rightT;
      
      const maxAngle = 0.35;
      const maxDiff = 40;
      this.targetAngle = Math.max(-maxAngle, Math.min(maxAngle, -diff / maxDiff * maxAngle));
      
      this.currentAngle += (this.targetAngle - this.currentAngle) * dt * 5;
      
      if (Math.abs(diff) < this.tolerance) {
        this.holdTime += dt;
        if (this.holdTime >= this.requiredHold) {
          this.solved = true;
          this.finished = true;
        }
      } else {
        this.holdTime = Math.max(0, this.holdTime - dt * 2);
      }
    }
  
    checkResult() {
      if (!this.finished) return null;
      
      const leftT = this.getLeftTorque();
      const rightT = this.getRightTorque();
      
      return {
        status: 'win',
        reason: `⚖️ الاکلنگ به تعادل رسید!`,
        score: 130,
        formula: {
          title: 'قانون گشتاور',
          calc: `F₁·d₁ = F₂·d₂ → ${leftT.toFixed(1)} = ${rightT.toFixed(1)}`,
          note: `گشتاور سمت چپ (${leftT.toFixed(1)} kg·m) با گشتاور سمت راست (${rightT.toFixed(1)} kg·m) برابر شد. مجموع جرم چپ: ${this.leftWeights.reduce((s,w)=>s+w.mass,0)} kg، راست: ${this.rightWeights.reduce((s,w)=>s+w.mass,0)} kg.`
        }
      };
    }
  
    render() {
      const ctx = this.ctx;
      const W = this.canvas.width;
      const H = this.canvas.height;
      
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#0a0f1e');
      skyGrad.addColorStop(0.6, '#1e293b');
      skyGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);
      
      this.renderStars(ctx);
      this.renderPivot(ctx);
      this.renderBar(ctx);
      this.renderWeights(ctx);
      this.renderRuler(ctx);
      this.renderHUD(ctx);
    }
  
    renderStars(ctx) {
      const W = this.canvas.width;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      
      for (let i = 0; i < 50; i++) {
        const x = (i * 137) % W;
        const y = (i * 79) % 200;
        const size = (i % 3) + 1;
        const twinkle = Math.sin(Date.now() / 500 + i) * 0.3 + 0.7;
        ctx.globalAlpha = twinkle;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  
    renderPivot(ctx) {
      const x = this.pivotX;
      const y = this.pivotY;
      
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 60, y + 200);
      ctx.lineTo(x + 60, y + 200);
      ctx.closePath();
      ctx.fill();
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.moveTo(x, y + 10);
      ctx.lineTo(x + 60, y + 200);
      ctx.lineTo(x + 70, y + 200);
      ctx.closePath();
      ctx.fill();
      
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  
    renderBar(ctx) {
      const angle = this.currentAngle;
      const halfLen = this.barLength / 2;
      
      ctx.save();
      ctx.translate(this.pivotX, this.pivotY);
      ctx.rotate(angle);
      
      ctx.fillStyle = '#a78bfa';
      ctx.shadowColor = '#a78bfa';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.roundRect(-halfLen, -this.barThickness / 2, this.barLength, this.barThickness, this.barThickness / 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-halfLen, 0);
      ctx.lineTo(halfLen, 0);
      ctx.stroke();
      
      for (let d = 1; d <= 5; d++) {
        const px = d * this.pixelsPerMeter;
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-px, -this.barThickness / 2);
        ctx.lineTo(-px, -this.barThickness / 2 - 8);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(px, -this.barThickness / 2);
        ctx.lineTo(px, -this.barThickness / 2 - 8);
        ctx.stroke();
      }
      
      ctx.restore();
    }
  
    renderWeights(ctx) {
      const angle = this.currentAngle;
      
      this.leftWeights.forEach((w) => {
        const xBefore = -w.distance * this.pixelsPerMeter;
        const yBefore = -30;
        
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const x = this.pivotX + xBefore * cos - yBefore * sin;
        const y = this.pivotY + xBefore * sin + yBefore * cos;
        
        this.drawWeight(ctx, x, y, w);
      });
      
      this.rightWeights.forEach((w) => {
        const xBefore = w.distance * this.pixelsPerMeter;
        const yBefore = -30;
        
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const x = this.pivotX + xBefore * cos - yBefore * sin;
        const y = this.pivotY + xBefore * sin + yBefore * cos;
        
        this.drawWeight(ctx, x, y, w);
      });
    }
  
    drawWeight(ctx, x, y, weight) {
      const size = 30 + weight.mass * 1.5;
      const halfSize = size / 2;
      
      if (weight.selected) {
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 6]);
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(x, y, halfSize + 15, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.shadowBlur = 0;
      }
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(x + 5, y + halfSize + 5, halfSize, halfSize * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = weight.color;
      ctx.shadowColor = weight.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(x - halfSize, y - halfSize, size, size, 8);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      const gradient = ctx.createLinearGradient(x - halfSize, y - halfSize, x + halfSize, y + halfSize);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
      gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(x - halfSize, y - halfSize, size, size, 8);
      ctx.fill();
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${weight.mass}kg`, x, y);
      ctx.textBaseline = 'alphabetic';
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText(`${weight.distance.toFixed(1)}m`, x, y + halfSize + 18);
    }
  
    renderRuler(ctx) {
      const y = 480;
      
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(this.pivotX - 200, y);
      ctx.lineTo(this.pivotX + 200, y);
      ctx.stroke();
      
      ctx.font = 'bold 10px Vazirmatn';
      ctx.textAlign = 'center';
      for (let d = -5; d <= 5; d++) {
        if (d === 0) continue;
        const x = this.pivotX + d * this.pixelsPerMeter * 2;
        
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
        ctx.beginPath();
        ctx.moveTo(x, y - 5);
        ctx.lineTo(x, y + 5);
        ctx.stroke();
        
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`${Math.abs(d)}m`, x, y + 18);
      }
    }
  
    renderHUD(ctx) {
      const W = this.canvas.width;
      const leftT = this.getLeftTorque();
      const rightT = this.getRightTorque();
      const diff = Math.abs(leftT - rightT);
      const balanced = diff < this.tolerance;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(20, 20, 220, 100, 15);
      ctx.fill();
      
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('⚖️ گشتاور چپ', 225, 45);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText(`${leftT.toFixed(1)} kg·m`, 225, 75);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText(`مجموع جرم: ${this.leftWeights.reduce((s,w)=>s+w.mass,0)} kg`, 225, 98);
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(250, 20, 220, 100, 15);
      ctx.fill();
      
      ctx.fillStyle = '#3b82f6';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('⚖️ گشتاور راست', 455, 45);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText(`${rightT.toFixed(1)} kg·m`, 455, 75);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText(`مجموع جرم: ${this.rightWeights.reduce((s,w)=>s+w.mass,0)} kg`, 455, 98);
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(W - 260, 20, 240, 100, 15);
      ctx.fill();
      
      ctx.fillStyle = balanced ? '#22c55e' : '#f59e0b';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText(balanced ? '✅ متعادل!' : '⚠️ اختلاف', W - 45, 45);
      
      ctx.fillStyle = balanced ? '#22c55e' : '#f59e0b';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText(`${diff.toFixed(1)}`, W - 45, 75);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText(`آستانه: ${this.tolerance} kg·m`, W - 45, 98);
      
      if (balanced && !this.finished) {
        const progress = this.holdTime / this.requiredHold;
        const barY = 135;
        const barW = 240;
        const barX = W - 260;
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.beginPath();
        ctx.roundRect(barX, barY, barW, 40, 12);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
        ctx.beginPath();
        ctx.roundRect(barX + 15, barY + 14, barW - 30, 12, 6);
        ctx.fill();
        
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.roundRect(barX + 15, barY + 14, (barW - 30) * progress, 12, 6);
        ctx.fill();
        
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 11px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText('⏳ نگه دار...', barX + barW / 2, barY + 38);
      }
      
      ctx.fillStyle = 'rgba(167, 139, 250, 0.9)';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText('🎯 وزنه‌ها را جابه‌جا کن تا گشتاور دو طرف برابر شود', W / 2, 145);
      
      if (this.selectedWeight) {
        const arr = this.selectedWeight.side === 'left' ? this.leftWeights : this.rightWeights;
        const w = arr[this.selectedWeight.index];
        const sideName = this.selectedWeight.side === 'left' ? 'چپ' : 'راست';
        
        ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(W / 2 - 200, 160, 400, 45, 12);
        ctx.fill();
        ctx.stroke();
        
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 14px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText(`🎯 انتخاب شده: وزنه ${w.mass}kg سمت ${sideName}`, W / 2, 185);
      } else {
        ctx.fillStyle = 'rgba(148, 163, 184, 0.15)';
        ctx.beginPath();
        ctx.roundRect(W / 2 - 200, 160, 400, 45, 12);
        ctx.fill();
        
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 14px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText('👆 روی وزنه کلیک کن یا از دکمه‌ها استفاده کن', W / 2, 185);
      }
    }
  }
  
  /* ══════════════════════════════════════════════════════════════
     ⚡ مرحله ۴: مدار الکتریکی
     ══════════════════════════════════════════════════════════════ */
  class Level4_Circuit extends BaseLevel {
    init() {
      this.voltage = 12;
      this.resistance = 20;
      this.minR = 1;
      this.maxR = 100;
      this.targetCurrent = 0.4;
      this.tolerance = 0.05;
      this.finished = false;
      this.elapsed = 0;
      this.successTime = 0;
      this.requiredHoldTime = 1.0;
      this.updateCurrent();
    }
  
    updateCurrent() {
      this.current = this.voltage / this.resistance;
      this.power = this.voltage * this.current;
      this.brightness = Math.min(1, this.power / 5);
    }
  
    handleInput(action, pressed) {
      if (action === 'rUp')   this.resistance = Math.min(this.maxR, this.resistance + 1);
      if (action === 'rDown') this.resistance = Math.max(this.minR, this.resistance - 1);
    }
  
    update(dt) {
      if (this.finished) return;
      this.elapsed += dt;
      this.updateCurrent();
      
      const diff = Math.abs(this.current - this.targetCurrent);
      if (diff < this.tolerance) {
        this.successTime += dt;
        if (this.successTime >= this.requiredHoldTime) this.finished = true;
      } else {
        this.successTime = Math.max(0, this.successTime - dt * 2);
      }
    }
  
    checkResult() {
      if (!this.finished) return null;
      return {
        status: 'win',
        reason: `⚡ لامپ با روشنایی مطلوب روشن شد!`,
        score: 110,
        formula: {
          title: 'قانون اهم',
          calc: `I = V / R = ${this.voltage} / ${this.resistance} = ${this.current.toFixed(2)} A`,
          note: `توان مصرفی: ${this.power.toFixed(2)} وات.`
        }
      };
    }
  
    render() {
      const ctx = this.ctx;
      const W = this.canvas.width;
      const H = this.canvas.height;
      
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0a0f1e');
      grad.addColorStop(1, '#1e293b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      
      const circuitTop = 140;
      const circuitBottom = 400;
      const circuitLeft = 150;
      const circuitRight = 850;
      
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(circuitLeft, circuitTop);
      ctx.lineTo(circuitRight, circuitTop);
      ctx.lineTo(circuitRight, circuitBottom);
      ctx.lineTo(circuitLeft, circuitBottom);
      ctx.closePath();
      ctx.stroke();
      
      this.renderBattery(ctx, circuitLeft, (circuitTop + circuitBottom) / 2);
      this.renderResistor(ctx, (circuitLeft + circuitRight) / 2, circuitTop);
      this.renderLamp(ctx, circuitRight, (circuitTop + circuitBottom) / 2);
      this.renderElectrons(ctx, circuitLeft, circuitTop, circuitRight, circuitBottom);
      this.renderHUD(ctx);
    }
  
    renderBattery(ctx, x, y) {
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(x - 35, y - 40, 70, 80, 10);
      ctx.fill();
      ctx.stroke();
      
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x - 15, y - 55, 30, 15);
      
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(x - 15, y + 40, 30, 15);
      
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 18px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText(`${this.voltage}V`, x, y + 6);
    }
  
    renderResistor(ctx, x, y) {
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(x - 80, y - 30, 160, 60, 10);
      ctx.fill();
      ctx.stroke();
      
      const colors = ['#ef4444', '#fbbf24', '#22c55e', '#3b82f6'];
      colors.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.fillRect(x - 50 + i * 30, y - 30, 8, 60);
      });
      
      ctx.fillStyle = '#a78bfa';
      ctx.font = 'bold 16px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText(`${this.resistance} Ω`, x, y + 6);
      
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px Vazirmatn';
      ctx.fillText('⬆️ ⬇️ برای تنظیم', x, y - 45);
    }
  
    renderLamp(ctx, x, y) {
      if (this.brightness > 0.05) {
        const glowRad = 40 + this.brightness * 80;
        const glow = ctx.createRadialGradient(x, y, 0, x, y, glowRad);
        glow.addColorStop(0, `rgba(251, 191, 36, ${this.brightness * 0.7})`);
        glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, glowRad, 0, Math.PI * 2);
        ctx.fill();
      }
      
      const bulbColor = `rgba(251, 191, 36, ${0.2 + this.brightness * 0.8})`;
      ctx.fillStyle = bulbColor;
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, 35, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      
      ctx.strokeStyle = `rgba(251, 191, 36, ${0.5 + this.brightness * 0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 12, y + 10);
      ctx.lineTo(x - 6, y - 8);
      ctx.lineTo(x, y + 8);
      ctx.lineTo(x + 6, y - 8);
      ctx.lineTo(x + 12, y + 10);
      ctx.stroke();
      
      ctx.fillStyle = '#64748b';
      ctx.fillRect(x - 20, y + 30, 40, 15);
      
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 14px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText('لامپ', x, y + 70);
      
      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText(`${Math.round(this.brightness * 100)}%`, x, y + 88);
    }
  
    renderElectrons(ctx, x1, y1, x2, y2) {
      const speed = this.current * 300;
      const t = (Date.now() / 1000) * speed;
      const spacing = 80;
      const offset = t % spacing;
      
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      
      const perimeter = 2 * ((x2 - x1) + (y2 - y1));
      
      for (let d = offset; d < perimeter; d += spacing) {
        const pos = this.getPointOnPerimeter(d, x1, y1, x2, y2);
        if (!pos) continue;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
  
    getPointOnPerimeter(d, x1, y1, x2, y2) {
      const w = x2 - x1;
      const h = y2 - y1;
      if (d < w) return { x: x1 + d, y: y1 };
      d -= w;
      if (d < h) return { x: x2, y: y1 + d };
      d -= h;
      if (d < w) return { x: x2 - d, y: y2 };
      d -= w;
      if (d < h) return { x: x1, y: y2 - d };
      return null;
    }
  
    renderHUD(ctx) {
      const W = this.canvas.width;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(20, 20, 210, 100, 15);
      ctx.fill();
      
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('⚡ جریان', 215, 45);
      
      const diff = Math.abs(this.current - this.targetCurrent);
      const inRange = diff < this.tolerance;
      
      ctx.fillStyle = inRange ? '#22c55e' : '#fff';
      ctx.font = 'bold 26px Vazirmatn';
      ctx.fillText(`${this.current.toFixed(2)} A`, 215, 78);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText(`هدف: ${this.targetCurrent.toFixed(2)} A`, 215, 100);
      
      if (inRange) {
        const progress = this.successTime / this.requiredHoldTime;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.beginPath();
        ctx.roundRect(20, 130, 210, 40, 12);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
        ctx.beginPath();
        ctx.roundRect(30, 145, 190, 12, 6);
        ctx.fill();
        
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.roundRect(30, 145, 190 * progress, 12, 6);
        ctx.fill();
        
        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 11px Vazirmatn';
        ctx.textAlign = 'center';
        ctx.fillText('⏳ نگه دار...', 125, 168);
      }
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.beginPath();
      ctx.roundRect(W - 280, 20, 260, 90, 15);
      ctx.fill();
      
      ctx.fillStyle = '#a78bfa';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText('قانون اهم', W - 55, 45);
      
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.fillText('V = I · R', W - 55, 78);
      
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.fillText('مقاومت را تغییر بده تا I مطلوب شود', W - 55, 100);
    }
  }
  /* ══════════════════════════════════════════════════════════════
   🧪 مرحله ۵: زنگ‌زدگی آهن (اکسایش-کاهش)

    this.clickZones = [];
    
    // ═══════ برچسب‌ها ═══════
    this.stageTitle = 'مرحله ۱: کدام فلز زنگ می‌زند؟';
