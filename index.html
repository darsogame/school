  /* ============================================================
     مدیریت کلیک
     ============================================================ */
  handleClick(x, y) {
    if (this.finished) return;
    
    for (const zone of this.clickZones) {
      if (x >= zone.x && x <= zone.x + zone.w &&
          y >= zone.y && y <= zone.y + zone.h) {
        zone.action();
        return;
      }
    }
  }

  // ⭐ برای hover افکت
  handleMouseMove(x, y) {
    this.mouseX = x;
    this.mouseY = y;
  }

  /* ============================================================
     انتخاب‌ها
     ============================================================ */
  selectMetal(metal) {
    this.selectedMetal = metal;
    this.stage = 'equation';
    this.stageTitle = 'مرحله ۲: کدام معادله زنگ‌زدگی آهن است؟';
    this.stageHint = 'معادله صحیح اکسایش آهن را انتخاب کن';
    this.clickZones = [];
  }

  selectEquation(equation) {
    this.selectedEquation = equation;
    this.stage = 'spray';
    this.stageTitle = 'مرحله ۳: کدام اسپری مانع زنگ‌زدگی می‌شود؟';
    this.stageHint = 'ماده‌ای انتخاب کن که آهن را محافظت کند';
    this.clickZones = [];
  }

  selectSpray(spray) {
    this.selectedSpray = spray;
    this.stage = 'result';
    this.stageTitle = 'در حال اسپری کردن...';
    this.stageHint = '';
    this.sprayAmount = 0;
    this.timeProgress = 0;
    this.finishTimer = 0;
    this.clickZones = [];
  }

  /* ============================================================
     به‌روزرسانی
     ============================================================ */
  update(dt) {
    if (this.finished) return;
    this.elapsed += dt;
    
    if (this.stage === 'result') {
      // ۱. انیمیشن اسپری
      if (this.sprayAmount < 1) {
        this.sprayAmount = Math.min(1, this.sprayAmount + dt * 0.8);
        return;
      }
      
      // ۲. انیمیشن گذر زمان
      if (this.timeProgress < 1) {
        this.timeProgress += dt * 0.4;
        return;
      }
      
      // ۳. تعیین نتیجه (یک بار)
      if (!this.result) {
        const metalOK = this.selectedMetal && this.selectedMetal.correct;
        const eqOK = this.selectedEquation && this.selectedEquation.correct;
        const sprayOK = this.selectedSpray && this.selectedSpray.correct;
        
        if (metalOK && eqOK && sprayOK) {
          this.result = 'win';
          this.rustAmount = 0;
        } else {
          this.result = 'lose';
          this.rustAmount = 1;
        }
        
        this.finishTimer = 0;
        return;
      }
      
      // ۴. تاخیر قبل از پایان (بدون setTimeout)
      this.finishTimer += dt;
      if (this.finishTimer >= 2.5) {
        this.finished = true;
      }
    }
  }

  /* ============================================================
     نتیجه
     ============================================================ */
  checkResult() {
    if (!this.finished) return null;
    
    if (this.result === 'win') {
      return {
        status: 'win',
        reason: `🎉 آفرین! آهن شما پس از سال‌ها سالم ماند!`,
        score: 200,
        formula: {
          title: 'واکنش اکسایش-کاهش آهن',
          calc: `4Fe + 3O₂ + 6H₂O → 4Fe(OH)₃`,
          note: `با انتخاب اسپری روی (Zn)، فلز فدا شونده ایجاد شد. روی به عنوان فلز فعال‌تر به جای آهن اکسید می‌شود: Zn → Zn²⁺ + 2e⁻. این روش «حفاظت کاتدی» نام دارد.`
        }
      };
    } else {
      const issues = [];
      if (!this.selectedMetal || !this.selectedMetal.correct) issues.push('فلز اشتباه');
      if (!this.selectedEquation || !this.selectedEquation.correct) issues.push('معادله اشتباه');
      if (!this.selectedSpray || !this.selectedSpray.correct) issues.push('اسپری اشتباه');
      
      return {
        status: 'lose',
        reason: `💥 آهن پس از سال‌ها زنگ زد و از بین رفت!`,
        formula: {
          title: 'واکنش زنگ‌زدگی آهن',
          calc: `4Fe + 3O₂ + 6H₂O → 4Fe(OH)₃`,
          note: `خطاهای شما: ${issues.join('، ')}. برای محافظت از آهن باید اسپری روی (Zn) استفاده کرد.`
        }
      };
    }
  }

  /* ============================================================
     رسم
     ============================================================ */
  render() {
    const ctx = this.ctx;
    const W = this.canvas.width;
    const H = this.canvas.height;
    
    // پس‌زمینه
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f172a');
    grad.addColorStop(1, '#1e293b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // عنوان مرحله
    this.renderStageTitle(ctx);
    
    // محتوای مرحله
    if (this.stage === 'metal') {
      this.renderMetalSelection(ctx);
    } else if (this.stage === 'equation') {
      this.renderEquationSelection(ctx);
    } else if (this.stage === 'spray') {
      this.renderSpraySelection(ctx);
    } else if (this.stage === 'result') {
      this.renderResult(ctx);
    }
  }

  /* ============================================================
     عنوان و نشانگر مراحل
     ============================================================ */
  renderStageTitle(ctx) {
    const W = this.canvas.width;
    
    // نوار بالا
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, W, 90);
    
    // عنوان
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 24px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText(this.stageTitle, W / 2, 40);
    
    // راهنما
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 14px Vazirmatn';
    ctx.fillText(this.stageHint, W / 2, 70);
    
    // نشانگر مراحل
    const stages = ['فلز', 'معادله', 'اسپری', 'نتیجه'];
    const stageOrder = { metal: 0, equation: 1, spray: 2, result: 3 };
    const currentIdx = stageOrder[this.stage];
    
    const totalW = stages.length * 100;
    const startX = W / 2 - totalW / 2 + 50;
    
    for (let i = 0; i < stages.length; i++) {
      const x = startX + i * 100;
      const active = i <= currentIdx;
      
      // دایره
      ctx.fillStyle = active ? '#22c55e' : 'rgba(100, 116, 139, 0.3)';
      ctx.beginPath();
      ctx.arc(x, 115, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // خط اتصال
      if (i < stages.length - 1) {
        ctx.strokeStyle = (i < currentIdx) ? '#22c55e' : 'rgba(100, 116, 139, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 10, 115);
        ctx.lineTo(x + 90, 115);
        ctx.stroke();
      }
      
      // برچسب
      ctx.fillStyle = active ? '#fff' : '#64748b';
      ctx.font = 'bold 11px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText(stages[i], x, 140);
    }
  }

  /* ============================================================
     مرحله ۱: انتخاب فلز
     ============================================================ */
  renderMetalSelection(ctx) {
    const startX = 100;
    const startY = 210;
    const cardW = 180;
    const cardH = 220;
    const gap = 30;
    
    this.clickZones = [];
    
    this.metals.forEach((metal, i) => {
      const x = startX + i * (cardW + gap);
      const y = startY;
      const isSelected = this.selectedMetal && this.selectedMetal.id === metal.id;
      const isHovered = this.isHovered(x, y, cardW, cardH);
      
      this.drawMetalCard(ctx, x, y, cardW, cardH, metal, isSelected, isHovered);
      
      this.clickZones.push({
        x, y, w: cardW, h: cardH,
        action: () => this.selectMetal(metal)
      });
    });
  }

  isHovered(x, y, w, h) {
    return this.mouseX >= x && this.mouseX <= x + w &&
           this.mouseY >= y && this.mouseY <= y + h;
  }

  drawMetalCard(ctx, x, y, w, h, metal, selected, hovered) {
    // سایه
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.beginPath();
    ctx.roundRect(x + 5, y + 5, w, h, 20);
    ctx.fill();
    
    // کارت
    ctx.fillStyle = selected ? '#1e40af' : (hovered ? '#334155' : '#1e293b');
    ctx.strokeStyle = selected ? '#38bdf8' : (hovered ? '#38bdf8' : 'rgba(148, 163, 184, 0.3)');
    ctx.lineWidth = selected ? 4 : 3;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 20);
    ctx.fill();
    ctx.stroke();
    
    // آیکون
    ctx.font = 'bold 60px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(metal.icon, x + w / 2, y + 70);
    ctx.textBaseline = 'alphabetic';
    
    // نام فلز
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Vazirmatn';
    ctx.fillText(metal.name, x + w / 2, y + 135);
    
    // نماد شیمیایی
    ctx.fillStyle = metal.color;
    ctx.font = 'bold 32px Vazirmatn';
    ctx.fillText(metal.symbol, x + w / 2, y + 185);
    
    // راهنمای hover
    if (hovered) {
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px Vazirmatn';
      ctx.fillText('👆 کلیک کن', x + w / 2, y + h - 15);
    }
  }

  /* ============================================================
     مرحله ۲: انتخاب معادله
     ============================================================ */
  renderEquationSelection(ctx) {
    const W = this.canvas.width;
    
    // نمایش فلز انتخاب‌شده
    if (this.selectedMetal) {
      ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
      ctx.beginPath();
      ctx.roundRect(W / 2 - 200, 165, 400, 50, 15);
      ctx.fill();
      
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 16px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.fillText(`فلز: ${this.selectedMetal.name} (${this.selectedMetal.symbol})`, W / 2, 197);
    }
    
    const startY = 240;
    const cardH = 85;
    const cardW = 800;
    const startX = (W - cardW) / 2;
    const gap = 15;
    
    this.clickZones = [];
    
    this.equations.forEach((eq, i) => {
      const x = startX;
      const y = startY + i * (cardH + gap);
      const isSelected = this.selectedEquation && this.selectedEquation.id === eq.id;
      const isHovered = this.isHovered(x, y, cardW, cardH);
      
      // سایه
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 4, cardW, cardH, 15);
      ctx.fill();
      
      // کارت
      ctx.fillStyle = isSelected ? '#1e40af' : (isHovered ? '#334155' : '#1e293b');
      ctx.strokeStyle = isSelected ? '#38bdf8' : (isHovered ? '#38bdf8' : 'rgba(148, 163, 184, 0.3)');
      ctx.lineWidth = isSelected ? 4 : 2;
      ctx.beginPath();
      ctx.roundRect(x, y, cardW, cardH, 15);
      ctx.fill();
      ctx.stroke();
      
      // معادله
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 22px Vazirmatn';
      ctx.textAlign = 'right';
      ctx.fillText(eq.text, x + cardW - 30, y + 40);
      
      // توضیح
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 13px Vazirmatn';
      ctx.fillText(eq.description, x + cardW - 30, y + 68);
      
      this.clickZones.push({
        x, y, w: cardW, h: cardH,
        action: () => this.selectEquation(eq)
      });
    });
  }

  /* ============================================================
     مرحله ۳: انتخاب اسپری
     ============================================================ */
  renderSpraySelection(ctx) {
    const W = this.canvas.width;
    
    // نمایش انتخاب‌های قبلی
    ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.beginPath();
    ctx.roundRect(W / 2 - 400, 165, 800, 45, 12);
    ctx.fill();
    
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 13px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText(
      `فلز: ${this.selectedMetal ? this.selectedMetal.name : '-'}  |  معادله: ${this.selectedEquation ? this.selectedEquation.text : '-'}`,
      W / 2, 192
    );
    
    const startX = 50;
    const startY = 240;
    const cardW = 220;
    const cardH = 250;
    const gap = 15;
    
    this.clickZones = [];
    
    this.sprays.forEach((spray, i) => {
      const x = startX + i * (cardW + gap);
      const y = startY;
      const isSelected = this.selectedSpray && this.selectedSpray.id === spray.id;
      const isHovered = this.isHovered(x, y, cardW, cardH);
      
      // سایه
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.roundRect(x + 5, y + 5, cardW, cardH, 20);
      ctx.fill();
      
      // کارت
      ctx.fillStyle = isSelected ? '#1e40af' : (isHovered ? '#334155' : '#1e293b');
      ctx.strokeStyle = isSelected ? '#38bdf8' : (isHovered ? '#38bdf8' : 'rgba(148, 163, 184, 0.3)');
      ctx.lineWidth = isSelected ? 4 : 3;
      ctx.beginPath();
      ctx.roundRect(x, y, cardW, cardH, 20);
      ctx.fill();
      ctx.stroke();
      
      // آیکون
      ctx.font = 'bold 70px Vazirmatn';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(spray.icon, x + cardW / 2, y + 75);
      ctx.textBaseline = 'alphabetic';
      
      // نام
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px Vazirmatn';
      ctx.fillText(spray.name, x + cardW / 2, y + 145);
      
      // توضیح (چند خطی)
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 12px Vazirmatn';
      
      const words = spray.description.split(' ');
      let line = '';
      let lineY = y + 180;
      
      words.forEach(word => {
        const test = line + word + ' ';
        if (ctx.measureText(test).width > cardW - 40 && line !== '') {
          ctx.fillText(line.trim(), x + cardW / 2, lineY);
          line = word + ' ';
          lineY += 20;
        } else {
          line = test;
        }
      });
      if (line) ctx.fillText(line.trim(), x + cardW / 2, lineY);
      
      this.clickZones.push({
        x, y, w: cardW, h: cardH,
        action: () => this.selectSpray(spray)
      });
    });
  }

  /* ============================================================
     مرحله ۴: نتیجه
     ============================================================ */
  renderResult(ctx) {
    if (this.sprayAmount < 1) {
      this.renderSprayAnimation(ctx);
      return;
    }
    
    if (this.timeProgress < 1) {
      this.renderTimeSkip(ctx);
      return;
    }
    
    if (this.result === 'win') {
      this.renderWinScene(ctx);
    } else if (this.result === 'lose') {
      this.renderLoseScene(ctx);
    }
  }

  /* ============================================================
     انیمیشن اسپری
     ============================================================ */
  renderSprayAnimation(ctx) {
    const W = this.canvas.width;
    const H = this.canvas.height;
    const cx = W / 2;
    const cy = H / 2;
    
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 24px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText('💨 در حال اسپری کردن...', cx, cy - 130);
    
    // فلز
    ctx.fillStyle = this.selectedMetal ? this.selectedMetal.color : '#64748b';
    ctx.beginPath();
    ctx.roundRect(cx - 80, cy - 30, 160, 80, 15);
    ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px Vazirmatn';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.selectedMetal ? this.selectedMetal.symbol : 'Fe', cx, cy + 10);
    ctx.textBaseline = 'alphabetic';
    
    // قوطی اسپری (حرکت از چپ به راست)
    const sprayX = cx - 250 + (this.sprayAmount * 200);
    const sprayY = cy - 180;
    
    ctx.fillStyle = this.selectedSpray ? this.selectedSpray.color : '#94a3b8';
    ctx.beginPath();
    ctx.roundRect(sprayX - 30, sprayY, 60, 100, 12);
    ctx.fill();
    
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.roundRect(sprayX - 20, sprayY - 15, 40, 20, 5);
    ctx.fill();
    
    ctx.font = 'bold 30px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.selectedSpray ? this.selectedSpray.icon : '💨', sprayX, sprayY + 55);
    ctx.textBaseline = 'alphabetic';
    
    // ذرات اسپری
    for (let i = 0; i < 30; i++) {
      const t = ((Date.now() / 300 + i * 0.3) % 1);
      const px = sprayX + 30 + t * (cx - sprayX);
      const py = sprayY + 50 + Math.sin(i * 1.5 + t * 10) * 30;
      
      const alpha = 1 - t;
      ctx.fillStyle = `rgba(148, 163, 184, ${alpha * 0.7})`;
      ctx.beginPath();
      ctx.arc(px, py, 3 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // نوار پیشرفت
    const barW = 400;
    const barH = 12;
    const barX = cx - barW / 2;
    const barY = cy + 130;
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, 6);
    ctx.fill();
    
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * this.sprayAmount, barH, 6);
    ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.round(this.sprayAmount * 100)}%`, cx, barY + 35);
  }

  /* ============================================================
     نمایش گذر زمان با لوگوی خانه و باب اسفنجی
     ============================================================ */
  renderTimeSkip(ctx) {
    const W = this.canvas.width;
    const H = this.canvas.height;
    const cx = W / 2;
    const cy = H / 2;
    
    // پس‌زمینه تیره نیمه‌شفاف
    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    ctx.fillRect(0, 0, W, H);
    
    // ═══ لوگوی خانه (🏠) ═══
    ctx.font = 'bold 100px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    const pulse = Math.sin(Date.now() / 400) * 5;
    ctx.fillText('🏠', cx - 150, cy - 60 + pulse);
    
    // ═══ لوگوی باب اسفنجی (🧽) ═══
    ctx.fillText('🧽', cx + 150, cy - 60 - pulse);
    
    // ═══ متن "سال بعد" ═══
    const years = Math.floor(this.timeProgress * 10);
    
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 44px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText(`${years} سال بعد...`, cx, cy + 80);
    
    ctx.textBaseline = 'alphabetic';
    
    // ═══ نوار پیشرفت ═══
    const barW = 500;
    const barH = 24;
    const barX = cx - barW / 2;
    const barY = cy + 140;
    
    ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, 12);
    ctx.fill();
    
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * this.timeProgress, barH, 12);
    ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText('⏳ زمان در حال گذر است...', cx, barY + 50);
  }

  /* ============================================================
     صحنه برد
     ============================================================ */
  renderWinScene(ctx) {
    const W = this.canvas.width;
    const H = this.canvas.height;
    const cx = W / 2;
    const cy = H / 2;
    
    // پس‌زمینه جشن
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, W / 2);
    grad.addColorStop(0, 'rgba(34, 197, 94, 0.3)');
    grad.addColorStop(1, 'rgba(15, 23, 42, 1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // لوگو
    ctx.font = 'bold 100px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏆', cx, cy - 130);
    ctx.textBaseline = 'alphabetic';
    
    // متن برد
    ctx.fillStyle = '#22c55e';
    ctx.font = 'bold 36px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText('🎉 آهن سالم ماند!', cx, cy - 20);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Vazirmatn';
    ctx.fillText('پس از ۱۰ سال، آهن شما کاملاً سالم است', cx, cy + 25);
    
    // آهن سالم
    ctx.fillStyle = '#64748b';
    ctx.beginPath();
    ctx.roundRect(cx - 60, cy + 60, 120, 60, 12);
    ctx.fill();
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px Vazirmatn';
    ctx.textBaseline = 'middle';
    ctx.fillText('Fe', cx - 30, cy + 90);
    ctx.font = 'bold 40px Vazirmatn';
    ctx.fillText('🔩', cx + 30, cy + 90);
    ctx.textBaseline = 'alphabetic';
    
    // پیام آموزشی
    ctx.fillStyle = '#a78bfa';
    ctx.font = 'bold 14px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText('💡 روی (Zn) به عنوان فلز فدا شونده، آهن را محافظت کرد', cx, cy + 160);
  }

  /* ============================================================
     صحنه باخت
     ============================================================ */
  renderLoseScene(ctx) {
    const W = this.canvas.width;
    const H = this.canvas.height;
    const cx = W / 2;
    const cy = H / 2;
    
    // پس‌زمینه غم
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, W / 2);
    grad.addColorStop(0, 'rgba(220, 38, 38, 0.3)');
    grad.addColorStop(1, 'rgba(15, 23, 42, 1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // لوگو
    ctx.font = 'bold 100px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💥', cx, cy - 130);
    ctx.textBaseline = 'alphabetic';
    
    // متن باخت
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 36px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText('😢 آهن زنگ زد!', cx, cy - 20);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Vazirmatn';
    ctx.fillText('پس از ۱۰ سال، آهن شما کاملاً خورده شد', cx, cy + 25);
    
    // آهن زنگ زده
    ctx.fillStyle = '#7c2d12';
    ctx.beginPath();
    ctx.roundRect(cx - 60, cy + 60, 120, 60, 12);
    ctx.fill();
    
    // ذرات زنگ
    for (let i = 0; i < 15; i++) {
      const px = cx - 60 + Math.random() * 120;
      const py = cy + 60 + Math.random() * 60;
      ctx.fillStyle = `rgba(180, 83, 9, ${Math.random() * 0.7 + 0.3})`;
      ctx.beginPath();
      ctx.arc(px, py, 3 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Vazirmatn';
    ctx.textBaseline = 'middle';
    ctx.fillText('Fe₂O₃', cx, cy + 90);
    ctx.textBaseline = 'alphabetic';
    
    // پیام آموزشی
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 14px Vazirmatn';
    ctx.textAlign = 'center';
    ctx.fillText('💡 برای محافظت، اسپری روی (Zn) لازم بود', cx, cy + 160);
  }
}
// ═══════ مرحله ۶: طناب و قرقره ═══════
/* ══════════════════════════════════════════════════════════════
   🪢 مرحله ۶: طناب و قرقره (نیروی کشش) - سه بعدی
   ══════════════════════════════════════════════════════════════
   مفهوم: نیروی کشش، مزیت مکانیکی، قانون کار
   هدف: با کشیدن طناب، جعبه را به هدف برسان
   
   فرمول‌ها:
   - نیروی کشش: T = (m·g) / n
   - مزیت مکانیکی: MA = n
   - کار: W = F·d
*/
class Level6_Pulley3D extends BaseLevel {
  init() {
    // ═══════ تنظیمات فیزیکی (واحد SI) ═══════
    this.g = 9.8;
    this.boxMass = 100;          // جرم جعبه (kg)
    this.frictionCoef = 0.3;     // ضریب اصطکاک زمین
    this.pulleyCount = 2;        // تعداد قرقره‌ها (مزیت مکانیکی)
    
    // ═══════ موقعیت‌های ۳ بعدی ═══════
    this.boxStartX = -4;
    this.boxEndX = 4;
    this.boxX = this.boxStartX;
    this.boxY = 0.5;
    this.boxZ = 0;
    
    // ═══════ حالت کشیدن ═══════
    this.pulling = false;
    this.pullPower = 0;          // قدرت کشیدن فعلی (0 تا 1)
    this.elapsed = 0;
    this.finished = false;
    this.won = false;
    
    // ═══════ سرعت و شتاب جعبه ═══════
    this.boxVelocity = 0;
    
    // ═══════ فیزیک کشیدن ═══════
    this.maxPullForce = 400;     // حداکثر نیروی کشیدن بازیکن (N)
    this.baseResistance = 50;    // مقاومت پایه (N)
    
    // ═══════ Three.js ═══════
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.objects = {};
    
    // ═══════ موقعیت‌های اولیه برای reset ═══════
    this.initialCameraPos = { x: 0, y: 4, z: 12 };
  }

  /* ============================================================
     ساخت صحنه ۳ بعدی
     ============================================================ */
  initThreeJS() {
    // ═══ صحنه ═══
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x0a1628);
    this.scene.fog = new THREE.Fog(0x0a1628, 15, 30);
    
    // ═══ دوربین ═══
    const aspect = this.canvas.width / this.canvas.height;
    this.camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
    this.camera.position.set(0, 5, 14);
    this.camera.lookAt(0, 1, 0);
    
    // ═══ رندرر ═══
    this.renderer = new THREE.WebGLRenderer({ 
      canvas: this.canvas,
      antialias: true,
      alpha: false
    });
    this.renderer.setSize(this.canvas.width, this.canvas.height, false);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    // ═══ نورپردازی ═══
    this.setupLights();
    
    // ═══ ساخت اجزای صحنه ═══
    this.buildGround();
    this.buildBox();
    this.buildPulleys();
    this.buildRope();
    this.buildTarget();
    
    // ═══ ستاره‌های پس‌زمینه ═══
    this.buildStars();
  }

  setupLights() {
    // نور محیطی
    const ambient = new THREE.AmbientLight(0x404060, 0.5);
    this.scene.add(ambient);
    
    // نور اصلی (خورشید)
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(8, 15, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -15;
    sun.shadow.camera.right = 15;
    sun.shadow.camera.top = 15;
    sun.shadow.camera.bottom = -15;
    this.scene.add(sun);
    
    // نور آبی از پایین
    const blueLight = new THREE.PointLight(0x38bdf8, 0.5, 20);
    blueLight.position.set(-5, 2, -5);
    this.scene.add(blueLight);
    
    // نور بنفش
    const purpleLight = new THREE.PointLight(0xa78bfa, 0.5, 20);
    purpleLight.position.set(5, 2, 5);
    this.scene.add(purpleLight);
  }

  buildGround() {
    // زمین
    const groundGeo = new THREE.PlaneGeometry(40, 40);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.9,
      metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    this.scene.add(ground);
    
    // خطوط شبکه روی زمین
    const grid = new THREE.GridHelper(40, 40, 0x38bdf8, 0x334155);
    grid.position.y = 0.01;
    grid.material.opacity = 0.3;
    grid.material.transparent = true;
    this.scene.add(grid);
  }

  buildBox() {
    // ═══ بدنه جعبه ═══
    const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const boxMat = new THREE.MeshStandardMaterial({
      color: 0x8b5cf6,
      roughness: 0.4,
      metalness: 0.3
    });
    const box = new THREE.Mesh(boxGeo, boxMat);
    box.castShadow = true;
    box.receiveShadow = true;
    box.position.set(this.boxX, this.boxY, this.boxZ);
    this.scene.add(box);
    this.objects.box = box;
    
    // ═══ نوارهای تزئینی ═══
    const stripeGeo = new THREE.BoxGeometry(1.55, 0.2, 1.55);
    const stripeMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24 });
    for (const y of [-0.5, 0.5]) {
      const stripe = new THREE.Mesh(stripeGeo, stripeMat);
      stripe.position.y = y;
      box.add(stripe);
    }
    
    // ═══ متن روی جعبه ═══
    const canvas2d = document.createElement('canvas');
    canvas2d.width = 256;
    canvas2d.height = 256;
    const ctx2d = canvas2d.getContext('2d');
    ctx2d.fillStyle = '#8b5cf6';
    ctx2d.fillRect(0, 0, 256, 256);
    ctx2d.fillStyle = '#ffffff';
    ctx2d.font = 'bold 100px Arial';
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    ctx2d.fillText('100kg', 128, 128);
    
    const texture = new THREE.CanvasTexture(canvas2d);
    const labelMat = new THREE.MeshStandardMaterial({ map: texture });
    const labelGeo = new THREE.PlaneGeometry(1.2, 1.2);
    const label = new THREE.Mesh(labelGeo, labelMat);
    label.position.z = 0.76;
    box.add(label);
  }

  buildPulleys() {
    // ═══ قرقره اصلی (روی سقف) ═══
    this.buildPulley(0, 6, 0, 0.6);
    
    // ═══ قرقره متحرک (روی جعبه) ═══
    this.buildPulley(0, 2.5, 0, 0.4);
  }

  buildPulley(x, y, z, radius) {
    const group = new THREE.Group();
    
    // ═══ چرخ قرقره ═══
    const wheelGeo = new THREE.CylinderGeometry(radius, radius, 0.2, 32);
    const wheelMat = new THREE.MeshStandardMaterial({
      color: 0xfbbf24,
      roughness: 0.3,
      metalness: 0.8
    });
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.castShadow = true;
    group.add(wheel);
    
    // ═══ محور قرقره ═══
    const axleGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 16);
    const axleMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9 });
    const axle = new THREE.Mesh(axleGeo, axleMat);
    axle.rotation.z = Math.PI / 2;
    group.add(axle);
    
    // ═══ براکت قرقره ═══
    const bracketGeo = new THREE.TorusGeometry(radius + 0.1, 0.05, 8, 32);
    const bracketMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
    const bracket = new THREE.Mesh(bracketGeo, bracketMat);
    bracket.rotation.y = Math.PI / 2;
    group.add(bracket);
    
    group.position.set(x, y, z);
    this.scene.add(group);
    
    // ذخیره برای انیمیشن
    if (y > 5) {
      this.objects.topPulley = group;
      this.objects.topPulleyWheel = wheel;
    } else {
      this.objects.movingPulley = group;
      this.objects.movingPulleyWheel = wheel;
    }
  }

  buildRope() {
    // ═══ طناب منحنی با TubeGeometry ═══
    this.ropeCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 6, 0),
      new THREE.Vector3(2, 5, 0),
      new THREE.Vector3(3, 3, 0),
      new THREE.Vector3(2, 1, 0),
      new THREE.Vector3(this.boxX, 1.5, 0)
    ]);
    
    const tubeGeo = new THREE.TubeGeometry(this.ropeCurve, 64, 0.06, 8, false);
    const tubeMat = new THREE.MeshStandardMaterial({
      color: 0xd97706,
      roughness: 0.9,
      metalness: 0.1
    });
    const rope = new THREE.Mesh(tubeGeo, tubeMat);
    rope.castShadow = true;
    this.scene.add(rope);
    this.objects.rope = rope;
  }

  updateRope() {
    // ═══ محاسبه منحنی جدید طناب ═══
    const boxTopY = this.boxY + 0.75;
    const movingPulleyY = boxTopY + 1.5;
    
    // موقعیت قرقره متحرک
    if (this.objects.movingPulley) {
      this.objects.movingPulley.position.set(this.boxX, movingPulleyY, 0);
    }
    
    const points = [
      new THREE.Vector3(0.5, 6, 0),                    // از قرقره اصلی
      new THREE.Vector3(2, 5.5, 0),
      new THREE.Vector3(2.5, movingPulleyY + 0.4, 0), // به قرقره متحرک
      new THREE.Vector3(this.boxX + 0.3, movingPulleyY, 0),
      new THREE.Vector3(this.boxX, boxTopY, 0)
    ];
    
    this.ropeCurve.points = points;
    
    // ساخت مجدد طناب
    const tubeGeo = new THREE.TubeGeometry(this.ropeCurve, 64, 0.06, 8, false);
    
    // حذف طناب قدیمی
    this.scene.remove(this.objects.rope);
    this.objects.rope.geometry.dispose();
    
    // ساخت طناب جدید
    const tubeMat = new THREE.MeshStandardMaterial({
      color: 0xd97706,
      roughness: 0.9,
      metalness: 0.1
    });
    const rope = new THREE.Mesh(tubeGeo, tubeMat);
    rope.castShadow = true;
    this.scene.add(rope);
    this.objects.rope = rope;
  }

  buildTarget() {
    // ═══ نشانگر هدف ═══
    const targetGeo = new THREE.RingGeometry(0.8, 1, 32);
    const targetMat = new THREE.MeshBasicMaterial({
      color: 0x22c55e,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.7
    });
    const target = new THREE.Mesh(targetGeo, targetMat);
    target.rotation.x = -Math.PI / 2;
    target.position.set(this.boxEndX, 0.02, 0);
    this.scene.add(target);
    this.objects.target = target;
    
    // ═══ ستون هدف ═══
    const pillarGeo = new THREE.CylinderGeometry(0.05, 0.05, 3, 8);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x22c55e, emissiveIntensity: 0.3 });
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.position.set(this.boxEndX, 1.5, 0);
    this.scene.add(pillar);
  }

  buildStars() {
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 500;
    const positions = new Float32Array(starsCount * 3);
    
    for (let i = 0; i < starsCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 100;
      positions[i + 1] = Math.random() * 50 + 5;
      positions[i + 2] = (Math.random() - 0.5) * 100;
    }
    
    starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
    const stars = new THREE.Points(starsGeo, starsMat);
    this.scene.add(stars);
  }

  /* ============================================================
     کنترل ورودی
     ============================================================ */
  handleInput(action, pressed) {
    if (this.finished) return;
    
    if (action === 'brake') {  // دکمه Space = کشیدن
      this.pulling = pressed;
      if (pressed) {
        this.pullPower = Math.min(1, this.pullPower + 0.1);
      }
    }
  }

  /* ============================================================
     به‌روزرسانی فیزیک
     ============================================================ */
  update(dt) {
    if (this.finished) return;
    this.elapsed += dt;
    
    // ═══ محاسبه نیروی کشش ═══
    const pullForce = this.pulling ? this.maxPullForce * this.pullPower : 0;
    
    // ═══ نیروی لازم برای غلبه بر اصطکاک ═══
    const normalForce = this.boxMass * this.g;  // N = mg
    const frictionForce = this.frictionCoef * normalForce;  // f = μN
    
    // ═══ مزیت مکانیکی ═══
    const mechanicalAdvantage = this.pulleyCount;
    const effectiveForce = pullForce * mechanicalAdvantage;
    
    // ═══ نیروی خالص ═══
    const netForce = effectiveForce - frictionForce;
    
    // ═══ شتاب: F = ma ═══
    const acceleration = netForce / this.boxMass;
    
    // ═══ به‌روزرسانی سرعت و موقعیت ═══
    this.boxVelocity += acceleration * dt;
    this.boxVelocity = Math.max(0, this.boxVelocity);  // نمی‌تواند منفی باشد (جعبه برنمی‌گردد)
    
    // اصطکاک سرعت را کم می‌کند وقتی کشیدن متوقف است
    if (!this.pulling && this.boxVelocity > 0) {
      this.boxVelocity = Math.max(0, this.boxVelocity - frictionForce * dt / this.boxMass);
    }
    
    this.boxX += this.boxVelocity * dt;
    this.boxX = Math.min(this.boxEndX, this.boxX);  // محدودیت
    
    // ═══ به‌روزرسانی Three.js ═══
    if (this.objects.box) {
      this.objects.box.position.x = this.boxX;
      
      // چرخش جزئی جعبه (افکت حرکت)
      this.objects.box.rotation.z = Math.sin(this.boxX * 4) * 0.02 * Math.min(1, this.boxVelocity);
    }
    
    // ═══ انیمیشن قرقره ═══
    if (this.objects.topPulleyWheel) {
      this.objects.topPulleyWheel.rotation.x += this.boxVelocity * 0.5 * dt;
    }
    if (this.objects.movingPulleyWheel) {
      this.objects.movingPulleyWheel.rotation.x += this.boxVelocity * 0.5 * dt;
    }
    
    // ═══ به‌روزرسانی طناب ═══
    this.updateRope();
    
    // ═══ بررسی برد ═══
    if (this.boxX >= this.boxEndX - 0.1) {
      this.finished = true;
      this.won = true;
    }
    
    // ═══ تایم‌اوت ═══
    if (this.elapsed > 60) {
      this.finished = true;
      this.won = false;
    }
    
    // ═══ کاهش تدریجی pullPower وقتی رها می‌شود ═══
    if (!this.pulling) {
      this.pullPower = Math.max(0, this.pullPower - dt * 0.5);
    }
  }

  /* ============================================================
     بررسی نتیجه
     ============================================================ */
  checkResult() {
    if (!this.finished) return null;
    
    const work = this.boxMass * this.g * this.frictionCoef * (this.boxEndX - this.boxStartX);
    const forceNeeded = (this.boxMass * this.g * this.frictionCoef) / this.pulleyCount;
    
    if (this.won) {
      return {
        status: 'win',
        reason: `🎉 جعبه به هدف رسید!`,
        score: 180,
        formula: {
          title: 'نیروی کشش و مزیت مکانیکی',
          calc: `T = f / n = ${(this.boxMass * this.g * this.frictionCoef).toFixed(0)} / ${this.pulleyCount} = ${forceNeeded.toFixed(0)} N`,
          note: `جعبه ${this.boxMass} کیلوگرمی با ضریب اصطکاک ${this.frictionCoef} روی زمین کشیده شد. با استفاده از ${this.pulleyCount} قرقره، مزیت مکانیکی برابر ${this.pulleyCount} شد و نیروی لازم به ${forceNeeded.toFixed(0)} نیوتن کاهش یافت. کار انجام‌شده: ${work.toFixed(0)} ژول.`
        }
      };
    } else {
      return {
        status: 'lose',
        reason: `😢 زمان تمام شد! جعبه به هدف نرسید.`,
        formula: {
          title: 'نیروی کشش',
          calc: `T = (m·g·μ) / n = ${(this.boxMass * this.g * this.frictionCoef).toFixed(0)} / ${this.pulleyCount} = ${forceNeeded.toFixed(0)} N`,
          note: `نیروی اصطکاک: ${(this.boxMass * this.g * this.frictionCoef).toFixed(0)} نیوتن. نیروی کششی که اعمال کردی کافی نبود.`
        }
      };
    }
  }

  /* ============================================================
     رسم
     ============================================================ */
  render() {
    // اگر Three.js هنوز ساخته نشده، بساز
    if (!this.scene) {
      this.initThreeJS();
    }
    
    // رندر صحنه
    this.renderer.render(this.scene, this.camera);
    
    // ═══ HUD روی کنواس اصلی ═══
    // چون WebGL کنواس رو پر می‌کنه، از HTML overlay استفاده نمی‌کنیم
    // در عوض، می‌توانیم یک canvas دومی برای HUD داشته باشیم
    // یا از همان canvas با Three.js استفاده کنیم و HUD رو در HTML بذاریم
    
    // ═══ رسم HUD با Canvas 2D بعد از رندر Three.js ═══
    this.renderHUDOverlay();
  }

  /* ══════════════════════════════════════════════════════════════
     🎮 موتور اصلی بازی
     ══════════════════════════════════════════════════════════════ */
  class GameEngine {
    constructor() {
      this.canvas = document.getElementById('gameCanvas');
      this.ctx = this.canvas.getContext('2d');
      
      this.levels = [];
      this.currentLevel = null;
      this.currentLevelIndex = -1;
      this.playingLevelIndex = -1;
      
      this.completedLevels = new Set();
      this.totalScore = 0;
      
      this.lastTime = 0;
      this.animationId = null;
      this.running = false;
      this.inputs = {};
      
      this.setupUI();
      this.loadProgress();
      this.registerLevels();
      this.renderLevelsScreen();
    }
  
    /* ⭐️ ثبت مراحل — اینجا مراحل جدید اضافه کنید */
    registerLevels() {
      this.levels = [
        {
          id: 1,
          name: 'ترمز به موقع',
          icon: '🚗',
          description: 'ماشین را در ناحیه پارک سبز متوقف کنید',
          Class: Level1_Brake,
          hint: 'برای ترمز دکمه را نگه دارید یا Space'
        },
        {
          id: 2,
          name: 'پرتابه',
          icon: '🏹',
          description: 'توپ را با زاویه و سرعت مناسب به هدف برسان',
          Class: Level2_Projectile,
          hint: '◀ ▶ زاویه، ▲ ▼ سرعت، Space شلیک'
        },
        {
          id: 3,
          name: 'تعادل اهرم',
          icon: '⚖️',
          description: 'وزنه‌ها را جابه‌جا کن تا الاکلنگ متعادل شود',
          Class: Level3_Balance,
          hint: 'وزنه را انتخاب کن و با ⬅ ➡ جابه‌جا کن'
        },
        {
          id: 4,
          name: 'مدار الکتریکی',
          icon: '⚡',
          description: 'مقاومت را تنظیم کنید تا لامپ با روشنایی مطلوب روشن شود',
          Class: Level4_Circuit,
          hint: 'با دکمه‌های ▲ ▼ مقاومت را تنظیم کنید'
        },
        {
      id: 5,
      name: 'زنگ‌زدگی آهن',
      icon: '🧪',
      description: 'فلز و معادله و اسپری درست را انتخاب کن',
      Class: Level5_Corrosion,
      hint: '👆 روی کارت‌ها کلیک کن'
        }
      ];
    }
  
    /* ===== UI ===== */
    setupUI() {
      document.getElementById('resetBtn').addEventListener('click', () => this.restartLevel());
      document.getElementById('backBtn').addEventListener('click', () => this.showLevelsScreen());
      
      document.getElementById('modalBackBtn').addEventListener('click', () => {
        document.getElementById('modal').classList.remove('active');
        this.showLevelsScreen();
      });
      document.getElementById('modalNextBtn').addEventListener('click', () => {
        document.getElementById('modal').classList.remove('active');
        this.nextLevel();
      });
      
      // کیبورد
      document.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        switch (e.code) {
          case 'Space':
            e.preventDefault();
            if (this.currentLevel instanceof Level2_Projectile) {
              this.setInput('launch', true);
              setTimeout(() => this.setInput('launch', false), 100);
            } else if (this.currentLevel instanceof Level3_Balance) {
              this.setInput('selectNext', true);
              setTimeout(() => this.setInput('selectNext', false), 100);
            } else {
              this.setInput('brake', true);
            }
            break;
          case 'ArrowLeft':
            e.preventDefault();
            this.setInput('angleDown', true);
            this.setInput('rotateLeft', true);
            this.setInput('moveLeft', true);
            break;
          case 'ArrowRight':
            e.preventDefault();
            this.setInput('angleUp', true);
            this.setInput('rotateRight', true);
            this.setInput('moveRight', true);
            break;
          case 'ArrowUp':
            e.preventDefault();
            this.setInput('speedUp', true);
            this.setInput('rUp', true);
            break;
          case 'ArrowDown':
            e.preventDefault();
            this.setInput('speedDown', true);
            this.setInput('rDown', true);
            break;
        }
      });
      
      document.addEventListener('keyup', (e) => {
        switch (e.code) {
          case 'Space':
            this.setInput('brake', false);
            this.setInput('selectNext', false);
            break;
          case 'ArrowLeft':
            this.setInput('angleDown', false);
            this.setInput('rotateLeft', false);
            this.setInput('moveLeft', false);
            break;
          case 'ArrowRight':
            this.setInput('angleUp', false);
            this.setInput('rotateRight', false);
            this.setInput('moveRight', false);
            break;
          case 'ArrowUp':
            this.setInput('speedUp', false);
            this.setInput('rUp', false);
            break;
          case 'ArrowDown':
            this.setInput('speedDown', false);
            this.setInput('rDown', false);
            break;
        }
      });
      // ⭐ کلیک روی کنواس (برای مرحله ۵)
      this.canvas.addEventListener('click', (e) => {
      if (!this.currentLevel) return;
      if (typeof this.currentLevel.handleClick !== 'function') return;
  
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
  
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
  
      this.currentLevel.handleClick(x, y);
      });

    // ⭐ حرکت موس (برای hover)
    this.canvas.addEventListener('mousemove', (e) => {
      if (!this.currentLevel) return;
      if (typeof this.currentLevel.handleMouseMove !== 'function') return;
  
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
  
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
  
      this.currentLevel.handleMouseMove(x, y);
      });

      // ⭐ تغییر cursor به pointer روی کنواس
      this.canvas.style.cursor = 'pointer';
      }
  
      setInput(action, pressed) {
      this.inputs[action] = pressed;
      if (this.currentLevel) {
        this.currentLevel.handleInput(action, pressed);
      }
      }
  
      /* ===== مدیریت پیشرفت ===== */
      loadProgress() {
      try {
        const data = JSON.parse(localStorage.getItem('physicsGameProgress') || '{}');
        this.totalScore = data.totalScore || 0;
        this.completedLevels = new Set(data.completedLevels || []);
      } catch(e) {}
      document.getElementById('totalScore').textContent = this.totalScore;
      }
  
      saveProgress() {
      try {
        localStorage.setItem('physicsGameProgress', JSON.stringify({
          totalScore: this.totalScore,
          completedLevels: [...this.completedLevels]
        }));
      } catch(e) {}
      document.getElementById('totalScore').textContent = this.totalScore;
      }
  
      /* ===== صفحه مراحل ===== */
      renderLevelsScreen() {
      const grid = document.getElementById('levelsGrid');
      grid.innerHTML = '';
      document.getElementById('totalLevels').textContent = this.levels.length;
      
      this.levels.forEach((level, idx) => {
        const completed = this.completedLevels.has(level.id);
        const unlocked = idx === 0 || this.completedLevels.has(this.levels[idx - 1].id);
        
        const card = document.createElement('div');
        card.className = 'level-card';
        if (completed) card.classList.add('completed');
        if (!unlocked) card.classList.add('locked');
        
        let statusText = '🔓 باز';
        if (completed) statusText = '✅ تکمیل';
        if (!unlocked) statusText = '🔒 قفل';
        
        card.innerHTML = `
          <div class="level-icon">${level.icon}</div>
          <div class="level-name">مرحله ${idx + 1}: ${level.name}</div>
          <div class="level-desc">${level.description}</div>
          <div class="level-status">${statusText}</div>
        `;
        
        if (unlocked) {
          card.addEventListener('click', () => this.startLevel(idx));
        }
        grid.appendChild(card);
      });
    }
  
    showLevelsScreen() {
      this.stop();
      document.getElementById('levelsScreen').classList.remove('hidden');
      document.getElementById('gameScreen').classList.remove('active');
      this.clearControls();
      this.renderLevelsScreen();
    }
  
    /* ===== شروع مرحله ===== */
    startLevel(index) {
      if (index < 0 || index >= this.levels.length) return;
      
      this.currentLevelIndex = index;
      this.playingLevelIndex = index;
      
      const levelData = this.levels[index];
      
      document.getElementById('levelsScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.add('active');
      
      document.getElementById('gameTitle').textContent = `مرحله ${index + 1}: ${levelData.name}`;
      document.getElementById('levelName').textContent = `مرحله ${index + 1}`;
      document.getElementById('levelHint').textContent = levelData.hint || '';
      document.getElementById('currentLevelNum').textContent = index + 1;
      
      this.clearControls();
      
      this.currentLevel = new levelData.Class(this);
      this.currentLevel.init();
      
      this.buildLevelControls(levelData.Class);
      
      this.start();
    }
  
    /* ⭐️ ساخت دکمه‌های خاص هر مرحله */
    buildLevelControls(LevelClass) {
      const controls = document.getElementById('gameControls');
      controls.innerHTML = '';
      
      // ═══════ مرحله ۱: ترمز ═══════
      if (LevelClass === Level1_Brake) {
        const brakeBtn = document.createElement('button');
        brakeBtn.className = 'ctrl-btn brake';
        brakeBtn.textContent = '🛑 ترمز';
        
        const press = (e) => { e.preventDefault(); this.setInput('brake', true); };
        const release = () => this.setInput('brake', false);
        
        brakeBtn.addEventListener('mousedown', press);
        brakeBtn.addEventListener('mouseup', release);
        brakeBtn.addEventListener('mouseleave', release);
        brakeBtn.addEventListener('touchstart', press, { passive: false });
        brakeBtn.addEventListener('touchend', release);
        
        controls.appendChild(brakeBtn);
      }
      
      // ═══════ مرحله ۲: پرتابه ═══════
      if (LevelClass === Level2_Projectile) {
        const angleDown = this.makeArrowBtn('◀', 'angleDown');
        angleDown.title = 'کاهش زاویه';
        
        const angleUp = this.makeArrowBtn('▶', 'angleUp');
        angleUp.title = 'افزایش زاویه';
        
        const speedDown = this.makeArrowBtn('▼', 'speedDown');
        speedDown.className = 'ctrl-arrow down';
        speedDown.title = 'کاهش سرعت';
        
        const speedUp = this.makeArrowBtn('▲', 'speedUp');
        speedUp.className = 'ctrl-arrow up';
        speedUp.title = 'افزایش سرعت';
        
        const launchBtn = document.createElement('button');
        launchBtn.className = 'ctrl-btn brake';
        launchBtn.textContent = '🚀 شلیک';
        launchBtn.style.background = 'linear-gradient(135deg, #f59e0b, #fbbf24)';
        launchBtn.style.color = '#1e293b';
        
        launchBtn.addEventListener('click', () => {
          this.setInput('launch', true);
          setTimeout(() => this.setInput('launch', false), 100);
        });
        
        controls.appendChild(angleDown);
        controls.appendChild(angleUp);
        controls.appendChild(speedDown);
        controls.appendChild(speedUp);
        controls.appendChild(launchBtn);
      }
      
      // ═══════ مرحله ۳: تعادل اهرم ═══════
      if (LevelClass === Level3_Balance) {
        const prevBtn = this.makeArrowBtn('◀', 'selectPrev');
        prevBtn.className = 'ctrl-arrow down';
        prevBtn.title = 'وزنه قبلی';
        
        const nextBtn = this.makeArrowBtn('▶', 'selectNext');
        nextBtn.title = 'وزنه بعدی';
        
        const moveLeftBtn = this.makeArrowBtn('⬅', 'moveLeft');
        moveLeftBtn.style.background = 'linear-gradient(135deg, #ef4444, #dc2626)';
        moveLeftBtn.title = 'حرکت به چپ';
        
        const moveRightBtn = this.makeArrowBtn('➡', 'moveRight');
        moveRightBtn.style.background = 'linear-gradient(135deg, #3b82f6, #1d4ed8)';
        moveRightBtn.title = 'حرکت به راست';
        
        controls.appendChild(prevBtn);
        controls.appendChild(nextBtn);
        controls.appendChild(moveLeftBtn);
        controls.appendChild(moveRightBtn);
      }
      
      // ═══════ مرحله ۴: مدار الکتریکی ═══════
      if (LevelClass === Level4_Circuit) {
        const upBtn = document.createElement('button');
        upBtn.className = 'ctrl-arrow up';
        upBtn.textContent = '▲';
        upBtn.title = 'افزایش مقاومت';
        this.bindCtrl(upBtn, 'rUp');
        
        const downBtn = document.createElement('button');
        downBtn.className = 'ctrl-arrow down';
        downBtn.textContent = '▼';
        downBtn.title = 'کاهش مقاومت';
        this.bindCtrl(downBtn, 'rDown');
        
        controls.appendChild(upBtn);
        controls.appendChild(downBtn);
      }
      // ═══════ مرحله ۵: زنگ‌زدگی ═══════
    if (LevelClass === Level5_Corrosion) {
      const hintBtn = document.createElement('button');
      hintBtn.className = 'ctrl-btn brake';
      hintBtn.textContent = '💡 راهنما';
      hintBtn.style.background = 'linear-gradient(135deg, #a78bfa, #8b5cf6)';
  
      hintBtn.addEventListener('click', () => {
        alert(
          '🔬 راهنمای بازی زنگ‌زدگی:\n\n' +
          '۱️⃣ فلزی که زنگ می‌زند: آهن (Fe) 🔩\n\n' +
          '۲️⃣ معادله درست:\n4Fe + 3O₂ + 6H₂O → 4Fe(OH)₃\n\n' +
          '۳️⃣ اسپری محافظ: اسپری روی (Zn) ⚙️\n\n' +
          '💡 نکته: روی فعال‌تر از آهن است و به جای آن اکسید می‌شود.\n' +
          'این روش «حفاظت کاتدی» نام دارد.'
        );
      });
  
      controls.appendChild(hintBtn);
    }
    }
  
    /* ===== پاک کردن دکمه‌ها ===== */
    clearControls() {
      const controls = document.getElementById('gameControls');
      if (controls) controls.innerHTML = '';
    }
  
    /* ===== ساخت دکمه پیکان ===== */
    makeArrowBtn(text, action) {
      const btn = document.createElement('button');
      btn.className = 'ctrl-arrow';
      btn.textContent = text;
      this.bindCtrl(btn, action);
      return btn;
    }
  
    /* ===== بایند دکمه با تکرار پیوسته ===== */
    bindCtrl(btn, action) {
      let interval = null;
      
      const startPress = (e) => {
        e.preventDefault();
        this.setInput(action, true);
        interval = setInterval(() => {
          this.setInput(action, true);
        }, 150);
      };
      
      const stopPress = () => {
        if (interval) {
          clearInterval(interval);
          interval = null;
        }
        this.setInput(action, false);
      };
      
      btn.addEventListener('mousedown', startPress);
      btn.addEventListener('mouseup', stopPress);
      btn.addEventListener('mouseleave', stopPress);
      btn.addEventListener('touchstart', startPress, { passive: false });
      btn.addEventListener('touchend', stopPress);
    }
  
    /* ===== شروع مجدد مرحله فعلی ===== */
    restartLevel() {
      if (this.playingLevelIndex >= 0 && this.playingLevelIndex < this.levels.length) {
        this.startLevel(this.playingLevelIndex);
      }
    }
  
    /* ===== رفتن به مرحله بعد ===== */
    nextLevel() {
      const next = this.currentLevelIndex + 1;
      if (next < this.levels.length) {
        this.startLevel(next);
      } else {
        this.showLevelsScreen();
      }
    }
  
    /* ===== حلقه بازی ===== */
    start() {
      this.running = true;
      this.lastTime = performance.now();
      this.loop();
    }
  
    stop() {
      this.running = false;
      if (this.animationId) {
        cancelAnimationFrame(this.animationId);
        this.animationId = null;
      }
    }
  
    loop() {
      if (!this.running) return;
      
      const now = performance.now();
      let dt = (now - this.lastTime) / 1000;
      this.lastTime = now;
      if (dt > 0.05) dt = 0.05;
      
      if (this.currentLevel) {
        this.currentLevel.update(dt);
        this.currentLevel.render();
        
        const result = this.currentLevel.checkResult();
        if (result) {
          this.handleResult(result);
          return;
        }
      }
      
      this.animationId = requestAnimationFrame(() => this.loop());
    }
  
    handleResult(result) {
      this.stop();
      setTimeout(() => this.showModal(result), 300);
    }
  
    showModal(result) {
      const modal = document.getElementById('modal');
      const emoji = document.getElementById('modalEmoji');
      const title = document.getElementById('modalTitle');
      const msg = document.getElementById('modalMsg');
      const nextBtn = document.getElementById('modalNextBtn');
      
      if (result.status === 'win') {
        emoji.textContent = '🎉';
        title.textContent = 'آفرین! مرحله تکمیل شد';
        const score = result.score || 100;
        this.totalScore += score;
        this.completedLevels.add(this.levels[this.currentLevelIndex].id);
        this.saveProgress();
        
        msg.innerHTML = this.buildResultMessage(result, score, true);
        nextBtn.textContent = this.currentLevelIndex < this.levels.length - 1 ? '▶ مرحله بعد' : '🏁 پایان';
      } else {
        emoji.textContent = '💥';
        title.textContent = 'متأسفانه!';
        msg.innerHTML = this.buildResultMessage(result, 0, false);
        nextBtn.textContent = '🔄 تلاش مجدد';
      }
      
      modal.classList.add('active');
    }
  
    buildResultMessage(result, score, isWin) {
      let html = `
        <div style="font-size:15px; color:#94a3b8; margin-bottom:20px; line-height:1.7;">
          ${result.reason}
          ${isWin ? `<br><br><span style="color:#fbbf24; font-weight:900; font-size:20px;">+${score} امتیاز</span>` : ''}
        </div>
      `;
      
      if (result.formula) {
        const bgColor = isWin 
          ? 'linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(167, 139, 250, 0.15))'
          : 'linear-gradient(135deg, rgba(220, 38, 38, 0.15), rgba(245, 158, 11, 0.15))';
        const borderColor = isWin ? 'rgba(56, 189, 248, 0.4)' : 'rgba(220, 38, 38, 0.4)';
        const titleColor = isWin ? '#38bdf8' : '#f59e0b';
        
        html += `
          <div style="
            background: ${bgColor};
            border: 2px solid ${borderColor};
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
            text-align: right;
            direction: rtl;
          ">
            <div style="font-size: 15px; font-weight: 900; color: ${titleColor}; margin-bottom: 12px; text-align: center;">
              📐 ${result.formula.title}
            </div>
            <div style="
              background: rgba(0, 0, 0, 0.3);
              padding: 12px 15px;
              border-radius: 10px;
              font-family: 'Courier New', monospace;
              font-size: 15px;
              color: #fbbf24;
              text-align: center;
              margin-bottom: 10px;
              font-weight: 700;
              direction: ltr;
            ">
              ${result.formula.calc}
            </div>
            <div style="font-size: 13px; color: #cbd5e1; line-height: 1.7; text-align: center;">
              ${result.formula.note}
            </div>
          </div>
        `;
      }
      
      return html;
    }
  
  }  /* ⭐ پایان کلاس GameEngine */
  
  /* ===== اجرا ===== */
  window.addEventListener('load', () => {
    window.game = new GameEngine();
  });
  </script>
